<script>
window.AdminQuiz = (() => {
  'use strict';
  function render(root, A) {
    return A.callServer('adminListQuizzes').then(r => {
      const list = r.quizzes || [];
      root.innerHTML = '<div class="panel"><div class="section-head"><h3>آزمون‌ها</h3><button class="btn btn-primary" id="createQuiz">+ آزمون جدید</button></div><p class="hint">پس از ثبت اولین تلاش، تنظیمات و سؤال‌ها قفل می‌شوند؛ برای تغییر یک آزمون جدید بسازید. برای اتصال آزمون به مسیر از بخش مسیرهای آموزشی استفاده کنید.</p><div class="table-wrap"><table class="data"><thead><tr><th>عنوان</th><th>تیم</th><th>سؤال</th><th>حدنصاب</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>'+list.map((q,i)=>'<tr><td>'+A.esc(q.title)+'</td><td>'+A.esc(((A.state.teams||[]).find(t=>t.key===q.teamKey)||{}).name||q.teamKey||'قدیمی: تعیین نشده')+'</td><td>'+A.fmtNum(q.questionCount)+'</td><td>'+A.fmtNum(q.passScore)+'٪</td><td>'+(q.active?'فعال':'غیرفعال')+'</td><td><button class="btn btn-soft btn-sm" data-questions="'+i+'">سؤال‌ها</button> <button class="btn btn-soft btn-sm" data-edit="'+i+'">تنظیمات</button> <button class="btn btn-danger btn-sm" data-disable="'+i+'">غیرفعال</button></td></tr>').join('')+'</tbody></table></div><div id="quizQuestions"></div></div>';
      root.querySelector('#createQuiz').onclick=()=>quizForm(null);
      root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>quizForm(list[+b.dataset.edit]));
      root.querySelectorAll('[data-questions]').forEach(b=>b.onclick=()=>questions(list[+b.dataset.questions]));
      root.querySelectorAll('[data-disable]').forEach(b=>b.onclick=()=>A.confirmModal({message:'آزمون غیرفعال شود؟',danger:true,onConfirm:()=>A.callServer('adminDeleteQuiz',list[+b.dataset.disable].quizId).then(()=>render(root,A)).catch(e=>A.toast(e.message,'error'))}));
      function quizForm(q) {
        q=q||{};
        A.openModal({title:q.quizId?'تنظیمات آزمون':'آزمون جدید',bodyHTML:'<form class="form-grid"><div class="form-field full"><label>عنوان</label><input name="title" required value="'+A.esc(q.title||'')+'"></div><div class="form-field full"><label>تیم آزمون</label><select name="teamKey" required><option value="">انتخاب تیم</option>'+ (A.state.teams||[]).map(t=>'<option value="'+A.esc(t.key)+'" '+(q.teamKey===t.key?'selected':'')+'>'+A.esc(t.name)+'</option>').join('')+'</select></div><div class="form-field full"><label>توضیحات</label><textarea name="description">'+A.esc(q.description||'')+'</textarea></div><div class="form-field"><label>حدنصاب درصد</label><input name="passScore" type="number" min="1" max="100" required value="'+A.esc(q.passScore||80)+'"></div><div class="form-field"><label>زمان به دقیقه (صفر: نامحدود)</label><input name="timeLimitMin" type="number" min="0" max="350" value="'+A.esc(q.timeLimitMin||0)+'"></div><div class="form-field"><label>حداکثر تلاش (صفر: نامحدود)</label><input name="maxAttempts" type="number" min="0" value="'+A.esc(q.maxAttempts||0)+'"></div><div class="form-field"><label>نمایش پاسخ صحیح</label><select name="showAnswers">'+[['always','همیشه'],['after_pass','پس از قبولی'],['never','هرگز']].map(x=>'<option value="'+x[0]+'" '+(q.showAnswers===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div><div class="form-field full"><label>شناسه فایل یا پوشه Drive برای اتصال مستقیم (اختیاری)</label><input name="refId" value="'+A.esc(q.refId||'')+'"></div><label class="check-row"><input type="checkbox" name="shuffleQuestions" '+(q.shuffleQuestions?'checked':'')+'> ترتیب تصادفی سؤال</label><label class="check-row"><input type="checkbox" name="shuffleOptions" '+(q.shuffleOptions?'checked':'')+'> ترتیب تصادفی گزینه</label><label class="check-row"><input type="checkbox" name="active" '+(q.active!==false?'checked':'')+'> فعال</label></form>',footHTML:'<button class="btn btn-soft" data-close>انصراف</button><button class="btn btn-primary" id="saveQuiz">ذخیره</button>',onMount:(m,f)=>{f.querySelector('#saveQuiz').onclick=()=>{const form=m.querySelector('form');if(!form.reportValidity())return;const d=new FormData(form), ref=String(d.get('refId')||'').trim(); const payload={quizId:q.quizId||'',teamKey:d.get('teamKey'),title:d.get('title'),description:d.get('description'),passScore:+d.get('passScore'),timeLimitMin:+d.get('timeLimitMin'),maxAttempts:+d.get('maxAttempts'),showAnswers:d.get('showAnswers'),refType:ref?'drive':'standalone',refId:ref,shuffleQuestions:form.elements.shuffleQuestions.checked,shuffleOptions:form.elements.shuffleOptions.checked,active:form.elements.active.checked};A.callServer('adminSaveQuiz',payload).then(()=>{A.closeModal();A.toast('آزمون ذخیره شد');render(root,A)}).catch(e=>A.toast(e.message,'error'));};}});
      }
      function questions(q) {
        const mount=root.querySelector('#quizQuestions');mount.innerHTML=A.loadingHTML();
        A.callServer('adminGetQuiz',q.quizId).then(r=>{
          const rows=r.questions||[];
          mount.innerHTML='<div class="section-head"><h3>سؤال‌های '+A.esc(q.title)+'</h3><button class="btn btn-primary btn-sm" id="newQuestion">+ سؤال</button></div><div class="table-wrap"><table class="data"><thead><tr><th>ترتیب</th><th>سؤال</th><th>نوع</th><th>نمره</th><th>عملیات</th></tr></thead><tbody>'+rows.map((x,i)=>'<tr><td>'+A.fmtNum(x.order)+'</td><td>'+A.esc(x.text)+'</td><td>'+A.esc(x.type)+'</td><td>'+A.fmtNum(x.points)+'</td><td><button class="btn btn-soft btn-sm" data-qedit="'+i+'">ویرایش</button> <button class="btn btn-danger btn-sm" data-qdelete="'+i+'">حذف</button></td></tr>').join('')+'</tbody></table></div>';
          mount.querySelector('#newQuestion').onclick=()=>questionForm(null);
          mount.querySelectorAll('[data-qedit]').forEach(b=>b.onclick=()=>questionForm(rows[+b.dataset.qedit]));
          mount.querySelectorAll('[data-qdelete]').forEach(b=>b.onclick=()=>A.confirmModal({message:'سؤال حذف شود؟',danger:true,onConfirm:()=>A.callServer('adminDeleteQuestion',rows[+b.dataset.qdelete].questionId).then(()=>questions(q)).catch(e=>A.toast(e.message,'error'))}));
        }).catch(e=>{mount.innerHTML=A.errorHTML(e.message)});
        function questionForm(x) {
          x=x||{};
          A.openModal({title:x.questionId?'ویرایش سؤال':'سؤال جدید',bodyHTML:'<form class="form-grid"><div class="form-field full"><label>متن سؤال یا سناریو</label><textarea name="text" required>'+A.esc(x.text||'')+'</textarea></div><div class="form-field"><label>نوع</label><select name="type">'+[['mcq','چهارگزینه‌ای'],['multi','چندانتخابی'],['tf','درست / غلط'],['essay','تشریحی'],['scenario','سناریومحور']].map(a=>'<option value="'+a[0]+'" '+(x.type===a[0]?'selected':'')+'>'+a[1]+'</option>').join('')+'</select></div><div class="form-field"><label>ترتیب</label><input type="number" name="order" min="1" value="'+A.esc(x.order||1)+'"></div><div class="form-field"><label>نمره</label><input type="number" name="points" min="0.1" step="0.1" required value="'+A.esc(x.points||1)+'"></div><div class="form-field full"><label>گزینه‌ها، هر گزینه در یک خط (برای تشریحی و درست/غلط لازم نیست)</label><textarea name="options">'+A.esc((x.options||[]).join('\n'))+'</textarea></div><div class="form-field full"><label>شماره گزینه صحیح؛ چندانتخابی با ویرگول جدا شود. درست = ۱، غلط = ۲</label><input name="correct" value="'+A.esc((x.correct||[]).map(v=>Number(v)+1).join(','))+'"></div></form>',footHTML:'<button class="btn btn-soft" data-close>انصراف</button><button class="btn btn-primary" id="saveQuestion">ذخیره</button>',onMount:(m,f)=>{f.querySelector('#saveQuestion').onclick=()=>{const form=m.querySelector('form');if(!form.reportValidity())return;const d=new FormData(form),type=d.get('type'),options=String(d.get('options')||'').split('\n').map(s=>s.trim()).filter(Boolean),raw=String(d.get('correct')||'').trim();if(type!=='essay'&&!/^\d+(\s*,\s*\d+)*$/.test(raw)){A.toast('شماره پاسخ صحیح را وارد کنید','error');return} const correct=raw?raw.split(',').map(n=>Number(n.trim())-1):[];if((type==='mcq'&&options.length!==4)||(type==='tf'&&(correct.length!==1||correct[0]<0||correct[0]>1))||(['mcq','scenario'].includes(type)&&correct.length!==1)){A.toast('تعداد گزینه‌ها یا پاسخ صحیح نامعتبر است','error');return}A.callServer('adminSaveQuestion',{quizId:q.quizId,questionId:x.questionId||'',text:d.get('text'),type,order:+d.get('order'),points:+d.get('points'),options,correct}).then(()=>{A.closeModal();A.toast('سؤال ذخیره شد');questions(q)}).catch(e=>A.toast(e.message,'error'));};}});
        }
      }
    });
  }
  function review(root,A) {
    return A.callServer('adminListAttempts',{status:'pending_review'}).then(r=>{
      const attempts=r.attempts||[];
      root.innerHTML='<div class="panel"><div class="section-head"><h3>پاسخ‌های در انتظار بازبینی</h3><span class="hint">حداکثر ۲۰۰ مورد آخر</span></div>'+(attempts.length?'<div class="table-wrap"><table class="data"><thead><tr><th>کارشناس</th><th>آزمون</th><th>تاریخ</th><th></th></tr></thead><tbody>'+attempts.map((a,i)=>'<tr><td>'+A.esc(a.userName)+'<br>'+A.esc(a.email)+'</td><td>'+A.esc(a.quizTitle)+'</td><td>'+A.fmtDateTime(a.timestamp)+'</td><td><button class="btn btn-primary btn-sm" data-review="'+i+'">بازبینی</button></td></tr>').join('')+'</tbody></table></div>':A.emptyHTML('✓','تلاشی در انتظار بازبینی نیست',''))+'</div>';
      root.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>open(attempts[+b.dataset.review]));
      function open(a) {
        A.openModal({title:'بازبینی آزمون',size:'lg',bodyHTML:A.loadingHTML()});
        A.callServer('adminGetAttemptDetail',a.attemptId).then(r=>{
          const map={};(r.attempt.answers||[]).forEach(x=>map[x.questionId]=x.value);const essays=(r.questions||[]).filter(q=>q.type==='essay');
          A.openModal({title:'بازبینی '+A.esc(a.userName),size:'lg',bodyHTML:'<form id="reviewForm">'+essays.map((q,i)=>'<div class="form-field"><label>'+A.esc(q.text)+' (حداکثر '+A.fmtNum(q.points)+')</label><p style="white-space:pre-wrap">'+A.esc(map[q.questionId]||'بدون پاسخ')+'</p><input type="number" name="mark'+i+'" min="0" max="'+q.points+'" step="0.1" required placeholder="نمره"></div>').join('')+'<div class="form-field"><label>بازخورد</label><textarea name="feedback"></textarea></div></form>',footHTML:'<button class="btn btn-soft" data-close>انصراف</button><button class="btn btn-primary" id="saveReview">ثبت نمره</button>',onMount:(m,f)=>{f.querySelector('#saveReview').onclick=()=>{const form=m.querySelector('form');if(!form.reportValidity())return;const marks={};essays.forEach((q,i)=>marks[q.questionId]=Number(form.elements['mark'+i].value));A.callServer('adminReviewAttempt',a.attemptId,marks,form.elements.feedback.value).then(()=>{A.closeModal();A.toast('بازبینی ثبت شد');review(root,A)}).catch(e=>A.toast(e.message,'error'));};}});
        }).catch(e=>A.openModal({title:'خطا',bodyHTML:A.errorHTML(e.message)}));
      }
    });
  }
  return {render, review};
})();
</script>
