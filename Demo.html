  const quizById = qid => load().quizzes.find(q => q.quizId === qid) || null;
  const questionsOf = qid => load().questions.filter(q => q.quizId === qid).sort((a, b) => a.order - b.order);
  const logActivity = (email, action, detail) => { load().activity.push({ id: uid('ACT'), timestamp: nowIso(), email, action, detail: detail || '' }); };
  const teamOfPath = pathId => (load().paths.find(p => p.pathId === pathId) || {}).teamKey;

  function markProgress(email, itemKey, score) {
    const d = load();
    const ex = d.progress.find(p => String(p.email).toLowerCase() === String(email).toLowerCase() && p.pathItemId === itemKey);
    if (ex) { ex.status = 'completed'; ex.completedAt = nowIso(); ex.score = score || 100; }
    else d.progress.push({ email, pathItemId: itemKey, status: 'completed', completedAt: nowIso(), score: score || 100 });
  }

  function findNode(id, parent) {
    const d = load();
    if (!id) return null;
    if (d.folders[id]) return d.folders[id];
    for (const key of Object.keys(d.folders)) {
      const f = d.folders[key];
      const hit = (f.children || []).find(c => c.id === id);
      if (hit) return hit;
    }
    return null;
  }

  function fileSizeLabel(n) {
    n = Number(n) || 0; if (!n) return '';
    if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    return Math.max(1, Math.round(n / 1024)) + ' KB';
  }
  function iconOf(mime) {
    mime = String(mime || '');
    if (mime.includes('folder')) return 'FOLDER';
    if (mime === 'application/pdf') return 'PDF';
    if (mime.startsWith('video/')) return 'VIDEO';
    if (mime.startsWith('image/')) return 'IMAGE';
    if (mime.includes('spreadsheet') || mime.includes('excel')) return 'SHEET';
    if (mime.includes('document') || mime.includes('word')) return 'DOC';
    if (mime.includes('presentation') || mime.includes('slides')) return 'SLIDES';
    return 'FILE';
  }
  function withStatus(item, email) {
    const pm = progressMapOf(email);
    const qm = {}; load().quizzes.forEach(q => { if (q.refType === 'drive') qm[q.refId] = q.quizId; });
    return Object.assign(item, {
      icon: iconOf(item.mimeType),
      size: item.kind === 'folder' ? '' : fileSizeLabel(item.size),
      quiz: qm[item.id] ? { available: true, quizId: qm[item.id] } : { available: false },
      status: pm['drive:' + item.id] ? 'completed' : 'not_started'
    });
  }

  function teamRoot(teamKey) {
    const name = { account: 'Account', mlm: 'MLM', bnpl: 'BNPL', telesales: 'Tele Sales' }[teamKey];
    return { id: 'root-' + teamKey, key: teamKey, name, color: { account: 'blue', mlm: 'orange', bnpl: 'green', telesales: 'purple' }[teamKey], icon: { account: '◈', mlm: '◇', bnpl: '▣', telesales: '◉' }[teamKey], mimeType: 'application/vnd.google-apps.folder' };
  }
  const pageOf = (list, pageToken, pageSize) => {
    const start = pageToken ? parseInt(pageToken, 10) || 0 : 0;
    const size = pageSize || 12;
    const slice = list.slice(start, start + size);
    return { items: slice, nextPageToken: (start + size < list.length) ? String(start + size) : '', hasMore: (start + size) < list.length };
  };

  /* ───────── API ───────── */
  const handlers = {
    getBootstrap() {
      const d = load();
      const teams = ['account', 'mlm', 'bnpl', 'telesales'].map(teamRoot);
      const myPaths = handlers.listMyPaths('').paths;
      const pm = progressMapOf(myEmail());
      const quizPass = passedQuizSet(myEmail());
      let pending = 0;
      myPaths.forEach(p => pathItemsOf(p.pathId).forEach(i => { if (i.quizId && !quizPass[i.quizId] && !pm['item:' + i.itemId]) pending++; }));
      const totals = myPaths.reduce((a, p) => ({ total: a.total + p.total, done: a.done + p.done }), { total: 0, done: 0 });
      return {
        ok: true,
        user: clone(DEMO_USER),
        drive: { rootName: 'فولدر اصلی آموزشی (نمونه)', error: '' },
        teams,
        stats: { teams: teams.length, paths: myPaths.length, totalItems: totals.total, completedItems: totals.done, completionPercent: totals.total ? Math.round(totals.done / totals.total * 100) : 0, pendingQuizzes: pending, totalAttempts: attemptsOf(myEmail()).length },
        activePaths: myPaths.filter(p => p.percent < 100).slice(0, 4),
        allPaths: myPaths,
        recommended: myPaths.filter(p => p.done === 0 && p.total > 0).slice(0, 3),
        recentActivity: d.activity.filter(a => a.email.toLowerCase() === myEmail()).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 6).map(a => ({ action: a.action, detail: a.detail, timestamp: a.timestamp })),
        announcements: handlers.listAnnouncements().announcements,
        pageSize: 12,
        roleLabels: { admin: 'مدیر سامانه', team_manager: 'مدیر تیم', mentor: 'منتور', learner: 'کارشناس' }
      };
    },

    listMyPaths(teamKey) {
      const d = load();
      const pm = progressMapOf(myEmail());
      const keys = teamKey ? [teamKey] : ['account', 'mlm', 'bnpl', 'telesales'];
      const paths = d.paths.filter(p => truthy(p.active) && keys.includes(p.teamKey)).sort((a, b) => a.order - b.order).map(p => {
        const items = pathItemsOf(p.pathId);
        const done = items.filter(i => pm['item:' + i.itemId]).length;
        const team = teamRoot(p.teamKey);
        return { pathId: p.pathId, teamKey: p.teamKey, teamName: team.name, teamColor: team.color, teamIcon: team.icon, title: p.title, description: p.description, order: p.order, total: items.length, done, percent: items.length ? Math.round(done / items.length * 100) : 0 };
      });
      return { ok: true, paths };
    },

    getPath(pathId) {
      const d = load();
      const p = d.paths.find(x => x.pathId === pathId);
      if (!p) throw new Error('مسیر یادگیری پیدا نشد.');
      const pm = progressMapOf(myEmail());
      const team = teamRoot(p.teamKey);
      const quizPass = passedQuizSet(myEmail());
      let blocked = false;
      const items = pathItemsOf(pathId).map(item => {
        const done = !!pm['item:' + item.itemId];
        let status;
        if (done) status = 'completed';
        else if (blocked) status = 'locked';
        else if (item.quizId && !quizPass[item.quizId]) status = 'quiz_pending';
        else status = 'available';
        if (truthy(item.required) && !done) blocked = true;
        const q = item.quizId ? quizById(item.quizId) : null;
        return { itemId: item.itemId, order: item.order, title: item.title, driveItemId: item.driveItemId, itemType: item.itemType, required: truthy(item.required), quizId: item.quizId || '', quiz: q ? { available: true, quizId: q.quizId, title: q.title, passScore: q.passScore, questionCount: questionsOf(q.quizId).length, timeLimitMin: q.timeLimitMin, maxAttempts: q.maxAttempts } : null, estimatedMin: item.estimatedMin, status, completedAt: pm['item:' + item.itemId] ? pm['item:' + item.itemId].completedAt : '' };
      });
      const done = items.filter(i => i.status === 'completed').length;
      return { ok: true, path: { pathId: p.pathId, teamKey: p.teamKey, teamName: team.name, title: p.title, description: p.description, order: p.order, total: items.length, done, percent: items.length ? Math.round(done / items.length * 100) : 0 }, items };
    },

    markItemComplete(pathItemId) {
      const d = load();
      const item = d.pathItems.find(i => i.itemId === pathItemId);
      if (!item) throw new Error('آیتم مسیر پیدا نشد.');
      if (item.quizId && !passedQuizSet(myEmail())[item.quizId]) throw new Error('برای تکمیل این مرحله ابتدا باید در آزمون متصل قبول شوید.');
      markProgress(myEmail(), 'item:' + item.itemId, 100);
      logActivity(myEmail(), 'path_item_complete', item.title);
      save();
      return { ok: true };
    },

    getLibraryPage(folderId, pageToken, searchText, typeFilter, teamKey) {
      const d = load();
      let targetId, targetName, children;
      if (!folderId) {
        const root = d.folders['root-' + teamKey];
        if (!root) throw new Error('تیم پیدا نشد.');
        targetId = root.id; targetName = root.name; children = root.children.slice();
      } else if (d.folders[folderId]) {
        targetId = folderId; targetName = d.folders[folderId].name; children = d.folders[folderId].children.slice();
      } else {
        throw new Error('این آیتم پوشه نیست یا دسترسی به آن مجاز نیست.');
      }
      if (searchText) children = children.filter(c => c.name.toLowerCase().includes(String(searchText).toLowerCase()));
      if (typeFilter === 'folder') children = children.filter(c => c.kind === 'folder');
      if (typeFilter === 'file') children = children.filter(c => c.kind !== 'folder');
      const foldersFirst = (a, b) => (a.kind === 'folder' ? 0 : 1) - (b.kind === 'folder' ? 0 : 1) || a.name.localeCompare(b.name, 'fa');
      children.sort(foldersFirst);
      const page = pageOf(children, pageToken, 12);
      return { ok: true, items: page.items.map(i => withStatus(clone(i), myEmail())), nextPageToken: page.nextPageToken, hasMore: page.hasMore, pageSize: 12, folderId: targetId, folderName: targetName, teamId: 'root-' + teamKey };
    },

    getItemDetail(teamKey, itemId) {
      const node = findNode(itemId);
      if (!node) throw new Error('آیتم پیدا نشد.');
      return { ok: true, item: withStatus(clone(node), myEmail()), quiz: (quizById((load().quizzes.find(q => q.refId === itemId) || {}).quizId || '') ? { available: true } : { available: false }) };
    },

    markDriveItemComplete(teamKey, itemId) {
      markProgress(myEmail(), 'drive:' + itemId, 100);
      logActivity(myEmail(), 'item_complete', itemId);
      save();
      return { ok: true };
    },

    getQuizForAttempt(quizId) {
      const d = load();
      const q = quizById(quizId);
      if (!q || !truthy(q.active)) throw new Error('این آزمون فعال نیست یا پیدا نشد.');
      const used = attemptsOf(myEmail()).filter(a => a.quizId === quizId).length;
      if (q.maxAttempts > 0 && used >= q.maxAttempts) throw new Error('تعداد تلاش‌های مجاز شما برای این آزمون به پایان رسیده است.');
      let questions = questionsOf(quizId).map(x => ({ questionId: x.questionId, order: x.order, type: x.type, text: x.text, options: x.options.slice(), points: x.points }));
      if (truthy(q.shuffleQuestions)) questions = shuffle(questions);
      const shuffleOptions = truthy(q.shuffleOptions);
      const tagged = questions.map(question => {
        if (!shuffleOptions || !question.options || question.options.length < 2) return question;
        const t = question.options.map((text, index) => ({ index, text }));
        return Object.assign({}, question, { options: shuffle(t) });
      });
      return { ok: true, quiz: { quizId: q.quizId, title: q.title, description: q.description, passScore: q.passScore, timeLimitMin: q.timeLimitMin || 0, maxAttempts: q.maxAttempts || 0, attemptsUsed: used, totalPoints: questions.reduce((s, x) => s + x.points, 0), shuffleOptions }, questions: tagged, attemptToken: q.timeLimitMin ? uid('tok') : '' };
    },

    submitQuiz(quizId, answers, timeSpentSec, attemptToken) {
      const d = load();
      const q = quizById(quizId);
      if (!q || !truthy(q.active)) throw new Error('این آزمون فعال نیست یا پیدا نشد.');
      const used = attemptsOf(myEmail()).filter(a => a.quizId === quizId).length;
      if (q.maxAttempts > 0 && used >= q.maxAttempts) throw new Error('تعداد تلاش‌های مجاز شما برای این آزمون به پایان رسیده است.');
      const questions = questionsOf(quizId);
      const totalPoints = questions.reduce((s, x) => s + x.points, 0);
      const hasEssay = questions.some(x => x.type === 'essay');
      const ansMap = {}; (answers || []).forEach(a => { if (a && a.questionId) ansMap[a.questionId] = a.value; });
      let earned = 0;
      const review = questions.map(question => {
        const given = ansMap[question.questionId];
        let isCorrect = null, awarded = 0;
        if (question.type === 'essay') { isCorrect = null; }
        else if (question.type === 'multi') { const g = (Array.isArray(given) ? given.map(Number).sort() : []); const c = question.correct.map(Number).sort(); isCorrect = g.length === c.length && g.every((v, i) => v === c[i]); }
        else { const g = (given === undefined || given === null) ? -1 : Number(given); isCorrect = g === Number(question.correct[0]); }
        if (isCorrect === true) { earned += question.points; awarded = question.points; }
        return { questionId: question.questionId, type: question.type, given: given === undefined ? null : given, correct: question.correct, isCorrect, awarded, points: question.points };
      });
      const score = totalPoints ? Math.round(earned / totalPoints * 100) : 0;
      const status = hasEssay ? 'pending_review' : 'auto';
      const passed = !hasEssay && score >= q.passScore;
      d.attempts.push({ attemptId: uid('ATT'), timestamp: nowIso(), email: myEmail(), quizId, score, passed, status, answers: answers || [], feedback: '', timeSpentSec: Number(timeSpentSec) || 0 });
      if (!hasEssay && passed) d.pathItems.filter(i => i.quizId === quizId).forEach(i => markProgress(myEmail(), 'item:' + i.itemId, score));
      logActivity(myEmail(), 'quiz_submit', q.title + ' — ' + score + '٪');
      save();
      const reveal = q.showAnswers === 'always' || (q.showAnswers === 'after_pass' && passed);
      return { ok: true, score, passed, status, correctCount: review.filter(r => r.isCorrect === true).length, wrongCount: review.filter(r => r.isCorrect === false).length, pendingCount: review.filter(r => r.isCorrect === null).length, totalQuestions: questions.length, passScore: q.passScore, attemptsUsed: used + 1, maxAttempts: q.maxAttempts || 0, review: reveal ? review.map(r => ({ questionId: r.questionId, given: r.given, correct: r.correct, isCorrect: r.isCorrect, awarded: r.awarded, points: r.points })) : null };
    },

    getMyTranscript() {
      const d = load();
      const qmap = {}; d.quizzes.forEach(q => qmap[q.quizId] = q);
      const mine = attemptsOf(myEmail()).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).map(a => ({ attemptId: a.attemptId, quizId: a.quizId, quizTitle: (qmap[a.quizId] || {}).title || 'آزمون حذف‌شده', score: a.score, passed: truthy(a.passed), status: a.status, timestamp: a.timestamp, timeSpentSec: a.timeSpentSec || 0, feedback: a.feedback || '' }));
      const best = {}; mine.forEach(a => { if (!best[a.quizId] || a.score > best[a.quizId].score) best[a.quizId] = a; });
      const summary = { totalAttempts: mine.length, passedQuizzes: Object.keys(best).filter(k => best[k].passed).length, uniqueQuizzes: Object.keys(best).length, avgScore: mine.length ? Math.round(mine.reduce((s, a) => s + a.score, 0) / mine.length) : 0 };
      return { ok: true, attempts: mine, summary };
    },

    listAnnouncements() {
      const d = load();
      return { ok: true, announcements: d.announcements.filter(a => truthy(a.active)).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)) };
    },

    /* ─── ادمین: کاربران ─── */
    adminListUsers() { const d = load(); return { ok: true, users: clone(d.users), teams: ['account', 'mlm', 'bnpl', 'telesales'].map(k => ({ key: k, name: teamRoot(k).name })) }; },

      else d.users.push({ email, name: payload.name || '', role, teams: teams.join(','), mentorEmail: (payload.mentorEmail || '').toLowerCase().trim(), canManage: !!payload.canManage, active: true, createdAt: nowIso() });
      logActivity(myEmail(), ex ? 'user_update' : 'user_create', email); save();

    adminSetUserActive(email, active) { const d = load(); const u = d.users.find(u => u.email.toLowerCase() === String(email).toLowerCase()); if (!u) throw new Error('کاربر پیدا نشد.'); u.active = !!active; logActivity(myEmail(), active ? 'user_activate' : 'user_deactivate', email); save(); return { ok: true }; },
    adminTeamsStatus() { return { ok: true, rootName: 'فولدر اصلی آموزشی (نمونه)', error: '', teams: ['account', 'mlm', 'bnpl', 'telesales'].map(k => ({ key: k, name: teamRoot(k).name, found: true, folderId: 'root-' + k })) }; },

      return { ok: true, quizId: row.quizId, created: true };
    },
    adminDeleteQuiz(quizId) { const d = load(); const q = quizById(quizId); if (!q) throw new Error('آزمون پیدا نشد.'); q.active = false; save(); return { ok: true }; },
    adminSaveQuestion(payload) {
      const d = load();
      const q = quizById(payload.quizId); if (!q) throw new Error('آزمون پیدا نشد.');
      const type = payload.type || 'mcq';
      const text = String(payload.text || '').trim(); if (!text) throw new Error('متن سؤال الزامی است.');
      const options = (payload.options || []).map(o => String(o)).filter(o => o.trim() !== '');
      let correct = payload.correct;
      if (type === 'tf') { correct = [Number(Array.isArray(correct) ? correct[0] : correct) === 1 ? 1 : 0]; }
      else if (type === 'essay') correct = [];
      else if (type === 'multi') { correct = (Array.isArray(correct) ? correct : [correct]).map(Number).filter(n => !isNaN(n) && n >= 0 && n < options.length); if (!correct.length) throw new Error('حداقل یک پاسخ صحیح انتخاب کنید.'); }
      else { const idx = Number(Array.isArray(correct) ? correct[0] : correct); if (isNaN(idx) || idx < 0 || idx >= options.length) throw new Error('پاسخ صحیح را انتخاب کنید.'); correct = [idx]; }
      const finalOptions = type === 'tf' ? ['درست', 'غلط'] : options;
      const row = { quizId: payload.quizId, order: Number(payload.order) || questionsOf(payload.quizId).length + 1, type, text, options: finalOptions, correct, points: Math.max(0, Number(payload.points) || 1) };
      if (payload.questionId) { const ex = d.questions.find(x => x.questionId === payload.questionId); if (!ex) throw new Error('سؤال پیدا نشد.'); Object.assign(ex, row); save(); return { ok: true, questionId: ex.questionId }; }
      row.questionId = uid('Q'); d.questions.push(row); save();
      return { ok: true, questionId: row.questionId, created: true };
    },
    adminDeleteQuestion(questionId) { const d = load(); const i = d.questions.findIndex(x => x.questionId === questionId); if (i === -1) throw new Error('سؤال پیدا نشد.'); d.questions.splice(i, 1); save(); return { ok: true }; },

    /* ─── ادمین: بازبینی ─── */
    adminListAttempts(filter) {
      const d = load(); filter = filter || {};
      const qmap = {}; d.quizzes.forEach(q => qmap[q.quizId] = q);
      const umap = {}; d.users.forEach(u => umap[u.email.toLowerCase()] = u.name);
      const status = filter.status || 'pending_review';
      const rows = d.attempts.filter(a => a.status !== 'in_progress')
        .filter(a => !status || a.status === status)
        .filter(a => !filter.quizId || a.quizId === filter.quizId)
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 200)
        .map(a => ({ attemptId: a.attemptId, timestamp: a.timestamp, email: a.email, userName: umap[String(a.email).toLowerCase()] || a.email, quizId: a.quizId, quizTitle: (qmap[a.quizId] || {}).title || 'آزمون حذف‌شده', score: a.score, passed: truthy(a.passed), status: a.status, feedback: a.feedback || '' }));
      return { ok: true, attempts: rows };
    },
    adminGetAttemptDetail(attemptId) {
      const d = load(); const a = d.attempts.find(x => x.attemptId === attemptId); if (!a) throw new Error('تلاش پیدا نشد.');
      return { ok: true, attempt: clone(a), questions: clone(questionsOf(a.quizId)) };
    },
    adminReviewAttempt(attemptId, essayMarks, feedback) {
      const d = load(); const a = d.attempts.find(x => x.attemptId === attemptId); if (!a) throw new Error('تلاش پیدا نشد.');
      const questions = questionsOf(a.quizId);
      const totalPoints = questions.reduce((s, x) => s + x.points, 0);
      const ansMap = {}; (a.answers || []).forEach(x => { if (x && x.questionId) ansMap[x.questionId] = x.value; });
      let earned = 0;
      questions.forEach(question => {
        if (question.type === 'essay') { const m = Number(essayMarks ? essayMarks[question.questionId] : 0); earned += Math.max(0, Math.min(question.points, isNaN(m) ? 0 : m)); }
        else if (question.type === 'multi') { const g = Array.isArray(ansMap[question.questionId]) ? ansMap[question.questionId].map(Number).sort() : []; const c = question.correct.map(Number).sort(); if (g.length === c.length && g.every((v, i) => v === c[i])) earned += question.points; }
        else { const g = Number(ansMap[question.questionId]); if (!isNaN(g) && g === Number(question.correct[0])) earned += question.points; }
      });
      const score = totalPoints ? Math.round(earned / totalPoints * 100) : 0;
      const q = quizById(a.quizId); const passScore = q ? q.passScore : 70;
      a.score = score; a.passed = score >= passScore; a.status = 'reviewed'; a.feedback = String(feedback || '');
      if (a.passed) d.pathItems.filter(i => i.quizId === a.quizId).forEach(i => markProgress(a.email, 'item:' + i.itemId, score));
      logActivity(myEmail(), 'attempt_reviewed', attemptId + ' → ' + score + '٪'); save();
      return { ok: true, score, passed: a.passed };
    },

    /* ─── گزارش‌ها ─── */
    reportSummary(teamKey) {
      const d = load();
      const keys = teamKey ? [teamKey] : ['account', 'mlm', 'bnpl', 'telesales'];
      const users = d.users.filter(u => truthy(u.active));
      const atts = d.attempts.filter(a => a.status !== 'in_progress');
      const teams = keys.map(key => {
        const members = users.filter(u => splitCsv(u.teams).includes(key));
        const memberEmails = members.map(m => m.email.toLowerCase());
        const ta = atts.filter(a => memberEmails.includes(String(a.email).toLowerCase()));
        const avgScore = ta.length ? Math.round(ta.reduce((s, a) => s + Number(a.score || 0), 0) / ta.length) : 0;
        const items = pathItemsOfAll(key);
        let sumPercent = 0, completedMembers = 0;
        members.forEach(m => { const c = completionOf(m.email, key); sumPercent += c.percent; if (c.percent >= 100 && c.total > 0) completedMembers++; });
        return { key, name: teamRoot(key).name, icon: teamRoot(key).icon, color: teamRoot(key).color, members: members.length, avgCompletion: members.length ? Math.round(sumPercent / members.length) : 0, completedMembers, attempts: ta.length, avgScore, passedAttempts: ta.filter(a => truthy(a.passed)).length, pendingReview: ta.filter(a => a.status === 'pending_review').length };
      });
      const totAttempts = teams.reduce((s, t) => s + t.attempts, 0);
      const totals = { members: teams.reduce((s, t) => s + t.members, 0), attempts: totAttempts, pendingReview: teams.reduce((s, t) => s + t.pendingReview, 0), avgScore: totAttempts ? Math.round(teams.reduce((s, t) => s + t.avgScore * t.attempts, 0) / totAttempts) : 0 };
      save();
      return { ok: true, teams, totals };

      function pathItemsOfAll(key) { const d2 = load(); const pathIds = d2.paths.filter(p => p.teamKey === key && truthy(p.active)).map(p => p.pathId); return d2.pathItems.filter(i => pathIds.includes(i.pathId) && truthy(i.active)); }
      function completionOf(email, key) { const d2 = load(); const items = pathItemsOfAll(key); const pm = {}; d2.progress.forEach(p => { if (p.email.toLowerCase() === email.toLowerCase()) pm[p.pathItemId] = p; }); const done = items.filter(i => pm['item:' + i.itemId]).length; return { total: items.length, done, percent: items.length ? Math.round(done / items.length * 100) : 0 }; }
    },
    reportTeamMembers(teamKey) {
      const d = load();
      const users = d.users.filter(u => truthy(u.active) && splitCsv(u.teams).includes(teamKey));
      const pathIds = d.paths.filter(p => p.teamKey === teamKey && truthy(p.active)).map(p => p.pathId);
      const items = d.pathItems.filter(i => pathIds.includes(i.pathId) && truthy(i.active));
      const members = users.map(u => {
        const pm = {}; d.progress.forEach(p => { if (p.email.toLowerCase() === u.email.toLowerCase()) pm[p.pathItemId] = p; });
        const done = items.filter(i => pm['item:' + i.itemId]).length;
        const mine = d.attempts.filter(a => String(a.email).toLowerCase() === u.email.toLowerCase() && a.status !== 'in_progress');
        const avgScore = mine.length ? Math.round(mine.reduce((s, a) => s + Number(a.score || 0), 0) / mine.length) : 0;
        let last = ''; mine.forEach(a => { if (!last || new Date(a.timestamp) > new Date(last)) last = a.timestamp; });
        return { email: u.email, name: u.name, role: u.role, completion: items.length ? Math.round(done / items.length * 100) : 0, itemsDone: done, itemsTotal: items.length, attempts: mine.length, avgScore, passed: mine.filter(a => truthy(a.passed)).length, pendingReview: mine.filter(a => a.status === 'pending_review').length, lastActivity: last };
      }).sort((a, b) => b.completion - a.completion);
      return { ok: true, members };
    },
    reportMember(email) {
      const d = load(); const target = String(email || '').toLowerCase().trim();
      const targetUser = d.users.find(u => u.email.toLowerCase() === target) || { email: target, name: target, role: 'learner', teams: '', mentorEmail: '' };
      const tTeams = splitCsv(targetUser.teams);
      const pm = {}; d.progress.forEach(p => { if (p.email.toLowerCase() === target) pm[p.pathItemId] = p; });
      const paths = d.paths.filter(p => truthy(p.active) && tTeams.includes(p.teamKey)).map(p => { const items = pathItemsOf(p.pathId); const done = items.filter(i => pm['item:' + i.itemId]).length; return { pathId: p.pathId, title: p.title, teamKey: p.teamKey, total: items.length, done, percent: items.length ? Math.round(done / items.length * 100) : 0 }; });
      const qmap = {}; d.quizzes.forEach(q => qmap[q.quizId] = q);
      const attempts = d.attempts.filter(a => String(a.email).toLowerCase() === target && a.status !== 'in_progress').sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).map(a => ({ attemptId: a.attemptId, quizId: a.quizId, quizTitle: (qmap[a.quizId] || {}).title || 'آزمون حذف‌شده', score: a.score, passed: truthy(a.passed), status: a.status, timestamp: a.timestamp, timeSpentSec: a.timeSpentSec || 0, feedback: a.feedback || '' }));
      const notes = d.mentorNotes.filter(n => String(n.menteeEmail).toLowerCase() === target).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      return { ok: true, member: { email: target, name: targetUser.name, role: targetUser.role, teams: tTeams, mentorEmail: targetUser.mentorEmail || '' }, paths, attempts, notes };
    },
    reportIncomplete(teamKey) {
      const d = load(); const keys = teamKey ? [teamKey] : ['account', 'mlm', 'bnpl', 'telesales'];
      const rows = [];
      keys.forEach(key => {
        const pathIds = d.paths.filter(p => p.teamKey === key && truthy(p.active)).map(p => p.pathId);
        const items = d.pathItems.filter(i => pathIds.includes(i.pathId) && truthy(i.active));
        d.users.filter(u => truthy(u.active) && splitCsv(u.teams).includes(key)).forEach(u => {
          const pm = {}; d.progress.forEach(p => { if (p.email.toLowerCase() === u.email.toLowerCase()) pm[p.pathItemId] = p; });
          const done = items.filter(i => pm['item:' + i.itemId]).length;
          const percent = items.length ? Math.round(done / items.length * 100) : 0;
          if (items.length > 0 && percent < 100) rows.push({ teamKey: key, teamName: teamRoot(key).name, email: u.email, name: u.name, completion: percent, remaining: items.length - done });
        });
      });
      rows.sort((a, b) => a.completion - b.completion);
      return { ok: true, rows };
    },
    reportExportCsv(kind, teamKey) {
      const d = load();
      let header = [], lines = [], filename = 'report.csv';
      const teamSummary = this.reportSummary(teamKey || '').teams;
      if (kind === 'team_summary') {
        header = ['تیم', 'تعداد اعضا', 'میانگین تکمیل (%)', 'اعضای تکمیل‌شده', 'تعداد تلاش آزمون', 'میانگین نمره', 'تلاش‌های قبول', 'در انتظار بازبینی'];
        lines = teamSummary.map(t => [t.name, t.members, t.avgCompletion, t.completedMembers, t.attempts, t.avgScore, t.passedAttempts, t.pendingReview]);
        filename = 'bimebazar-team-summary.csv';
      } else if (kind === 'user_progress' || kind === 'incomplete') {
        header = ['تیم', 'نام', 'ایمیل', 'نقش', 'تکمیل (%)', 'آیتم انجام‌شده', 'کل آیتم‌ها'];
        const keys = teamKey ? [teamKey] : ['account', 'mlm', 'bnpl', 'telesales'];
        keys.forEach(key => { const rep = handlers.reportTeamMembers(key); rep.members.forEach(m => { if (kind === 'incomplete' && m.completion >= 100) return; lines.push([teamRoot(key).name, m.name, m.email, m.role, m.completion, m.itemsDone, m.itemsTotal]); }); });
        filename = kind === 'incomplete' ? 'bimebazar-incomplete.csv' : 'bimebazar-user-progress.csv';
      } else if (kind === 'attempts') {
        header = ['تاریخ', 'ایمیل', 'آزمون', 'نمره', 'وضعیت', 'نتیجه', 'زمان (ثانیه)'];
        const qmap = {}; d.quizzes.forEach(q => qmap[q.quizId] = q);
        d.attempts.filter(a => a.status !== 'in_progress').forEach(a => lines.push([new Date(a.timestamp).toLocaleString('fa-IR'), a.email, (qmap[a.quizId] || {}).title || '', a.score, a.status, truthy(a.passed) ? 'قبول' : 'رد', a.timeSpentSec || 0]));
        filename = 'bimebazar-attempts.csv';
      }
      const esc = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const csv = '﻿' + [header].concat(lines).map(r => r.map(esc).join(',')).join('\r\n');
      return { ok: true, filename, csvBase64: btoa(unescape(encodeURIComponent(csv))) };
    },
    addMentorNote(menteeEmail, note) {
      const d = load();
      if (!note || !String(note).trim()) throw new Error('متن بازخورد خالی است.');
      d.mentorNotes.push({ id: uid('NOTE'), timestamp: nowIso(), mentorEmail: myEmail(), menteeEmail: String(menteeEmail).toLowerCase().trim(), note: String(note).trim() });
      logActivity(myEmail(), 'mentor_note', menteeEmail); save();
      return { ok: true };
    },

    /* ─── اعلانات ادمین ─── */
    adminListAnnouncements() { const d = load(); return { ok: true, announcements: clone(d.announcements).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)) }; },
    adminSaveAnnouncement(payload) {
      const d = load();
      if (!payload.title || !String(payload.title).trim()) throw new Error('عنوان اعلان الزامی است.');
      if (payload.id) { const ex = d.announcements.find(a => a.id === payload.id); if (!ex) throw new Error('اعلان پیدا نشد.'); Object.assign(ex, { title: payload.title.trim(), body: payload.body || '', audience: payload.audience || 'all', active: payload.active !== false }); save(); return { ok: true, id: ex.id }; }
      const id = uid('ANN');
      d.announcements.push({ id, title: String(payload.title).trim(), body: payload.body || '', audience: payload.audience || 'all', active: payload.active !== false, createdAt: nowIso() });
      logActivity(myEmail(), 'announcement_create', payload.title); save();
      return { ok: true, id, created: true };
    },
    adminDeleteAnnouncement(id) { const d = load(); const i = d.announcements.findIndex(a => a.id === id); if (i === -1) throw new Error('اعلان پیدا نشد.'); d.announcements.splice(i, 1); save(); return { ok: true }; }
  };

  function request(fn, args) {
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        try {
          const handler = handlers[fn];
          if (!handler) throw new Error('تابع «' + fn + '» در حالت پیش‌نمایش پیاده‌سازی نشده است.');
          resolve(handler.apply(handlers, args || []));
        } catch (e) { reject(e); }
      }, 140); // تأخیر مصنوعی برای نمایش واقعی Loading State
    });
  }

  return {
    isDemo: true,
    request,
    reset,
    user: DEMO_USER
  };
})();
</script>
