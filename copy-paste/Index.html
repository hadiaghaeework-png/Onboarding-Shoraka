<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="سامانه آموزش، آنبوردینگ و ارزیابی یادگیری کارکنان بیمه‌بازار">
  <title>آکادمی یادگیری | بیمه‌بازار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
/* ════════════════════════════════════════════════════════════
   BimeBazar Learning Academy — Design System
   مرجع: نمونه UI دمو (ساختار/کامپوننت‌ها) + هویت برند بیمه‌بازار
   تم روشن/تاریک با CSS Variables — تغییر بدون Reload
   ════════════════════════════════════════════════════════════ */

:root{
  /* سطوح و رنگ‌ها — تم روشن */
  --bg:#f5f6fa;
  --panel:#ffffff;
  --panel-2:#f7f8fc;
  --panel-3:#eef0f7;
  --text:#1c2536;
  --muted:#6f7890;
  --line:#e7e9f1;
  --line-strong:#d8dbe8;

  /* برند */
  --brand-yellow:#edbe46;
  --brand-yellow-strong:#dda92e;
  --brand-yellow-soft:#fdf3d8;
  --brand-navy:#1b2a47;
  --brand-navy-2:#24365b;
  --brand-navy-3:#0f1b31;

  --primary:#d9a72e;            /* دکمه اصلی — زرد برند با کنتراست کافی روی سفید */
  --primary-hover:#c1911f;
  --on-primary:#33270a;
  --primary-soft:#fbf0cd;
  --primary-ring:rgba(221,169,46,.35);

  --accent:#2f6fed;
  --ok:#1a9e6b;  --ok-soft:#e2f6ee;
  --warn:#b45309; --warn-soft:#fdf0d5;
  --danger:#d64545; --danger-soft:#fce8e8;
  --info:#2563eb; --info-soft:#e4edfe;

  --shadow:0 12px 34px rgba(27,42,71,.09);
  --shadow-lg:0 24px 60px rgba(15,27,49,.22);
  --radius:16px; --radius-lg:20px; --radius-sm:11px;

  --sidebar-w:264px;
  color-scheme:light;
}

[data-theme="dark"]{
  --bg:#0b1220;
  --panel:#131c30;
  --panel-2:#18223a;
  --panel-3:#1f2b47;
  --text:#e9edf8;
  --muted:#93a0bf;
  --line:#232f4d;
  --line-strong:#33415f;

  --brand-yellow:#f2c959;
  --brand-yellow-strong:#e3b43c;
  --brand-yellow-soft:#2a2410;

  --primary:#f2c959;
  --primary-hover:#ffd873;
  --on-primary:#2c230a;
  --primary-soft:#2b2510;
  --primary-ring:rgba(242,201,89,.3);

  --accent:#6ea0ff;
  --ok:#34d399;  --ok-soft:#10281f;
  --warn:#fbbf24; --warn-soft:#2c230e;
  --danger:#f87171; --danger-soft:#2e1414;
  --info:#7aa5ff; --info-soft:#131f38;

  --shadow:0 14px 36px rgba(0,0,0,.35);
  --shadow-lg:0 26px 64px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Vazirmatn,Tahoma,sans-serif; font-size:14px; line-height:1.75;
  transition:background .25s ease,color .25s ease;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
code{background:var(--panel-3);padding:1px 6px;border-radius:6px;font-size:12px}
::selection{background:var(--brand-yellow);color:#241d07}

/* ════════════ چیدمان اصلی ════════════ */
.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) 1fr}

/* ── سایدبار ── */
#sidebar{
  background:var(--panel);border-left:1px solid var(--line);
  padding:22px 16px 16px;display:flex;flex-direction:column;gap:22px;
  position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;
  transition:background .25s ease,border-color .25s ease;
}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px}
.brand-mark{
  width:46px;height:46px;flex:0 0 auto;border-radius:14px;
  background:#fff;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 6px 18px rgba(221,169,46,.35),inset 0 0 0 1px rgba(0,0,0,.04);
}
.brand-mark img{width:82%;height:82%;object-fit:contain}
.brand-text strong{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.brand-text small{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.2px}

#sideNav{display:grid;gap:6px}
.nav-item{
  display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);
  padding:11px 12px;border-radius:13px;text-align:right;font-weight:600;font-size:13px;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease;
  position:relative;
}
.nav-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{
  background:linear-gradient(135deg,var(--brand-navy) 0%,var(--brand-navy-2) 100%);
  color:#fdf6dd;box-shadow:0 10px 24px rgba(15,27,49,.35);
}
[data-theme="dark"] .nav-item.active{background:linear-gradient(135deg,#f2c959,#e3b43c);color:#2c230a;box-shadow:0 10px 26px rgba(242,201,89,.28)}
.nav-item .nav-badge{margin-inline-start:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}

.side-bottom{margin-top:auto;display:grid;gap:12px}
.side-user{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);cursor:pointer;transition:.2s;text-align:right}
.side-user:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.avatar{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--brand-navy),var(--brand-navy-2));color:var(--brand-yellow);display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
[data-theme="dark"] .avatar{background:linear-gradient(135deg,#f2c959,#dda92e);color:#2c230a}
.side-user-meta{min-width:0}
.side-user-meta strong{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.side-user-meta small{color:var(--muted);font-size:11px}
.side-user-arrow{color:var(--muted);margin-inline-start:auto;font-size:18px}

.theme-toggle{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:13px;padding:11px 12px;font-size:12px;font-weight:700;color:var(--text);transition:.2s}
.theme-toggle:hover{border-color:var(--primary)}
.tt-icon{width:26px;height:26px;border-radius:8px;background:var(--panel);display:grid;place-items:center;font-size:14px;border:1px solid var(--line)}
.side-foot{color:var(--muted);font-size:10px;text-align:center;line-height:1.9;border-top:1px solid var(--line);padding-top:12px}

.scrim{display:none;position:fixed;inset:0;background:rgba(5,9,20,.55);z-index:25;backdrop-filter:blur(2px)}
.scrim.show{display:block}

/* ── ستون اصلی ── */
main{padding:20px 26px 40px;max-width:1560px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.topbar-start{display:flex;align-items:center;gap:12px}
.welcome h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.2px}
.welcome small{color:var(--muted);font-size:12px}
.topbar-end{display:flex;align-items:center;gap:10px}

.search{position:relative;display:flex;align-items:center}
.search input{
  width:min(400px,38vw);border:1px solid var(--line);background:var(--panel);border-radius:13px;
  padding:10px 42px 10px 40px;outline:none;transition:border-color .2s,box-shadow .2s;font-size:13px;
}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-ring)}
.search-ic{position:absolute;right:13px;font-size:19px;color:var(--muted);pointer-events:none}
.search kbd{position:absolute;left:12px;border:1px solid var(--line-strong);border-radius:6px;font-size:10px;color:var(--muted);padding:2px 7px;background:var(--panel-2)}

.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;width:40px;height:40px;display:inline-grid;place-items:center;font-size:16px;transition:.18s;color:var(--text)}
.icon-btn:hover{border-color:var(--primary);transform:translateY(-1px)}
.bell{position:relative}
.bell-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.only-mobile{display:none}

/* ── بنر حالت دمو ── */
.demo-banner{
  display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);
  border:1px dashed var(--warn);border-radius:13px;padding:10px 14px;font-size:12px;margin-bottom:16px;
}
.view{display:grid;gap:22px}

/* ════════════ کارت‌های آماری ════════════ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s,border-color .2s;
}
.stat:hover{transform:translateY(-3px);border-color:var(--primary)}
.stat .stat-label{color:var(--muted);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.stat .stat-num{display:block;font-size:26px;margin-top:6px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .stat-foot{font-size:10.5px;color:var(--muted);margin-top:2px}
.stat .stat-ic{position:absolute;top:14px;left:16px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--panel-2);color:var(--primary)}
.stat.accent .stat-ic{background:var(--info-soft);color:var(--info)}
.stat.ok .stat-ic{background:var(--ok-soft);color:var(--ok)}
.stat.warn .stat-ic{background:var(--warn-soft);color:var(--warn)}
.stat.gold .stat-ic{background:var(--brand-yellow-soft);color:var(--primary-hover)}

/* ════════════ هیرو ════════════ */
.hero{
  position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:26px 28px;
  min-height:158px;display:flex;align-items:center;justify-content:space-between;gap:20px;
  background:
    radial-gradient(1100px 320px at 85% -40%,rgba(242,201,89,.28),transparent 55%),
    linear-gradient(120deg,var(--brand-navy-3) 0%,var(--brand-navy) 48%,var(--brand-navy-2) 100%);
  color:#fdf9ec;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.07);
}
.hero-watermark{position:absolute;left:-24px;top:50%;transform:translateY(-50%);width:210px;opacity:.16;pointer-events:none;filter:saturate(1.1)}
.hero-content{position:relative}
.hero .hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.6px;color:#f2c959;background:rgba(242,201,89,.12);border:1px solid rgba(242,201,89,.35);padding:4px 12px;border-radius:30px;margin-bottom:10px}
.hero h2{font-size:22px;margin:0 0 6px;font-weight:800;letter-spacing:-.3px}
.hero p{margin:0;color:#c9d2ec;font-size:12.5px;max-width:520px}
.hero-cta{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hero-progress{position:relative;text-align:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px 20px;backdrop-filter:blur(6px);min-width:132px}
.hero-progress strong{font-size:30px;font-weight:800;color:#f2c959;font-variant-numeric:tabular-nums}
.hero-progress small{display:block;color:#c9d2ec;font-size:10.5px;margin-top:2px}
.hero-progress .ring{margin:6px auto 0}

/* ════════════ تیتر بخش ════════════ */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:2px 0 0}
.section-head h3{margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.section-head small{color:var(--muted);font-size:11.5px}
.section-head .section-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ════════════ گرید تیم‌ها ════════════ */
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.team-card{
  text-align:right;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);
  padding:18px;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;
  transition:transform .22s,box-shadow .22s,border-color .22s;text-decoration:none;color:inherit;
}
.team-card::before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:var(--team-accent,var(--brand-yellow))}
.team-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--team-accent,var(--brand-yellow))}
.team-symbol{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:21px;margin-bottom:12px;background:color-mix(in srgb,var(--team-accent,#edbe46) 16%,var(--panel));color:var(--team-accent,#d9a72e)}
.team-card h4{margin:0;font-size:15.5px;font-weight:800}
.team-card p{margin:2px 0 0;color:var(--muted);font-size:11px;min-height:34px}
.team-meta{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.team-meta span{font-size:10.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted)}
.team-progress{margin-top:12px}
.team-progress .tp-row{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:5px}
.team-progress .tp-bar{height:6px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.team-progress .tp-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--brand-yellow-strong),var(--brand-yellow));width:0;transition:width .8s ease}
.team-go{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--primary-hover);font-size:12px;font-weight:800;border-top:1px dashed var(--line-strong);padding-top:12px}

/* ════════════ مسیر یادگیری ════════════ */
.path-shell{display:grid;grid-template-columns:1fr;gap:14px}
.path-header{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;
  display:flex;align-items:center;gap:20px;box-shadow:var(--shadow);flex-wrap:wrap;
}
.path-header-main{flex:1;min-width:240px}
.path-header-main h2{margin:0 0 4px;font-size:19px}
.path-header-main p{margin:0;color:var(--muted);font-size:12px}
.path-steps{display:grid;gap:10px;position:relative}
.pstep{
  display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;transition:border-color .2s,box-shadow .2s;position:relative;
}
.pstep:hover{border-color:var(--line-strong)}
.pstep.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pstep.locked{opacity:.62}
.pstep-index{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;background:var(--panel-2);color:var(--muted);position:relative}
.pstep.done .pstep-index{background:var(--ok-soft);color:var(--ok)}
.pstep.available .pstep-index{background:var(--brand-yellow-soft);color:var(--primary-hover)}
.pstep.quiz_pending .pstep-index{background:var(--info-soft);color:var(--info)}
.pstep-body h4{margin:0;font-size:13.5px}
.pstep-body .pstep-meta{color:var(--muted);font-size:11px;display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.pstep-body .pstep-meta span{display:inline-flex;align-items:center;gap:5px}
.pstep-actions{display:flex;gap:8px;align-items:center}
.tag{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:800;letter-spacing:.2px;display:inline-flex;align-items:center;gap:5px}
.tag-gold{background:var(--brand-yellow-soft);color:var(--primary-hover)}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-info{background:var(--info-soft);color:var(--info)}
.tag-muted{background:var(--panel-3);color:var(--muted)}
.tag-danger{background:var(--danger-soft);color:var(--danger)}
.tag-folder{background:var(--brand-yellow-soft);color:var(--primary-hover)}
.tag-req{background:var(--danger-soft);color:var(--danger)}
.tag-opt{background:var(--panel-3);color:var(--muted)}

.progress-bar{height:10px;background:var(--panel-3);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand-yellow-strong),var(--brand-yellow));border-radius:6px;transition:width .8s ease}
.progress-big{display:flex;align-items:center;gap:14px}
.progress-big .pb-num{font-size:21px;font-weight:800;min-width:56px;font-variant-numeric:tabular-nums}

/* ════════════ کتابخانه ════════════ */
.library-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filter{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;outline:none;font-size:12.5px}
.filter:focus{border-color:var(--primary)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:9px 14px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.active{background:var(--brand-navy);color:#fdf6dd}
[data-theme="dark"] .seg button.active{background:var(--brand-yellow);color:#2c230a}

.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:2px}
.crumbs button{border:0;background:none;color:var(--primary-hover);cursor:pointer;font-weight:700;padding:2px 4px;border-radius:6px}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{color:var(--line-strong)}

.items{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;min-height:158px;
  display:flex;flex-direction:column;gap:0;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;
}
.item:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--brand-yellow-strong)}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.file-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:.3px;background:var(--panel-2);color:var(--primary-hover);border:1px solid var(--line)}
.file-icon.folder{background:var(--brand-yellow-soft);border-color:transparent;font-size:19px}
.item h4{font-size:12.5px;margin:12px 0 4px;word-break:break-word;line-height:1.8;min-height:44px}
.item small{color:var(--muted);font-size:10.5px}
.item-actions{display:flex;gap:7px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.status-dot{position:absolute;top:14px;left:14px;width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.status-dot.done{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}

.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.pages{display:flex;gap:8px;align-items:center}
.pages button{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-width:38px;height:38px;padding:0 12px;transition:.15s}
.pages button:hover:not(:disabled){border-color:var(--primary);color:var(--primary-hover)}
.pages button:disabled{opacity:.35;cursor:not-allowed}
.pages .page-now{min-width:38px;height:38px;display:grid;place-items:center;background:var(--brand-navy);color:#fdf6dd;border-radius:10px;font-weight:800;padding:0 12px}
[data-theme="dark"] .pages .page-now{background:var(--brand-yellow);color:#2c230a}

/* ════════════ دکمه‌ها ════════════ */
.btn{border:0;border-radius:11px;padding:9px 16px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 16px var(--primary-ring)}
.btn-primary:hover:not(:disabled){background:var(--primary-hover);color:#fff}
[data-theme="dark"] .btn-primary:hover:not(:disabled){color:#2c230a}
.btn-navy{background:var(--brand-navy);color:#fdf6dd}
[data-theme="dark"] .btn-navy{background:var(--brand-yellow);color:#2c230a}
.btn-soft{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
.btn-soft:hover{border-color:var(--line-strong)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid transparent}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--text);background:var(--panel-2)}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:9px}
.btn-block{width:100%;justify-content:center}

/* ════════════ مودال ════════════ */
.overlay{position:fixed;inset:0;background:rgba(5,9,20,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:50;backdrop-filter:blur(3px)}
.overlay.open{display:flex;animation:fadeIn .2s ease}
.modal{
  background:var(--panel);width:min(620px,100%);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:popIn .28s cubic-bezier(.2,.9,.3,1.2);
}
.modal.modal-lg{width:min(880px,100%)}
.modal.modal-xl{width:min(1080px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:15.5px}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel-2)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ════════════ فرم‌ها ════════════ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-field{display:grid;gap:6px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:11.5px;font-weight:700;color:var(--muted)}
.form-field input,.form-field select,.form-field textarea{
  border:1px solid var(--line);background:var(--panel-2);border-radius:11px;padding:10px 12px;outline:none;font-size:13px;transition:.2s;
}
.form-field textarea{resize:vertical;min-height:70px}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--primary);background:var(--panel);box-shadow:0 0 0 4px var(--primary-ring)}
.check-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.check-row input{width:17px;height:17px;accent-color:var(--primary-hover)}
.hint{font-size:10.5px;color:var(--muted)}

/* ════════════ جدول‌ها ════════════ */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table.data{width:100%;border-collapse:collapse;font-size:12px;min-width:640px}
table.data th{background:var(--panel-2);text-align:right;padding:11px 14px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tr:hover td{background:var(--panel-2)}

/* ════════════ لودر/اسکلتون/خالی/خطا ════════════ */
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:spin .8s linear infinite;margin:auto}
.loading{padding:44px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.skeleton{background:linear-gradient(110deg,var(--panel-2) 30%,var(--panel-3) 50%,var(--panel-2) 70%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px;min-height:14px}
.empty,.error-box{padding:40px 24px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty .empty-ic{font-size:38px;opacity:.5;display:block;margin-bottom:8px}
.error-box{color:var(--danger);border-color:var(--danger)}
.empty h4{margin:6px 0;color:var(--text)}
.full-span{grid-column:1/-1}

/* ════════════ آزمون ════════════ */
.quiz-start{text-align:center;padding:8px 6px 4px}
.quiz-start .qs-icon{width:70px;height:70px;border-radius:20px;background:var(--brand-yellow-soft);color:var(--primary-hover);display:grid;place-items:center;font-size:32px;margin:0 auto 12px}
.quiz-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.quiz-meta span{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:11px;color:var(--muted)}
.quiz-timer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:6px 14px}
.quiz-timer.danger{color:var(--danger);background:var(--danger-soft)}
.q-progress{height:6px;background:var(--panel-3);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.q-progress-fill{height:100%;background:var(--primary);transition:width .3s}
.question-block{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--panel-2)}
.question-block .q-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:13px;font-weight:800}
.question-block .q-points{color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap}
.option{display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:.15s;background:var(--panel)}
.option:hover{border-color:var(--primary)}
.option input{accent-color:var(--primary-hover);width:17px;height:17px;flex:0 0 auto}
.option.selected{border-color:var(--primary);background:var(--brand-yellow-soft);box-shadow:0 0 0 3px var(--primary-ring)}
.essay-box{width:100%;min-height:110px;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:12px;outline:none}
.essay-box:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-ring)}
.q-palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.q-dot{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:11px;font-weight:800;color:var(--muted)}
.q-dot.current{border-color:var(--primary);color:var(--on-primary);background:var(--primary)}
.q-dot.answered{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.result{text-align:center;padding:10px 6px}
.result .score-ring{margin:4px auto 12px}
.result h3{margin:4px 0}
.result p{color:var(--muted);margin:6px 0}
.review-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;font-size:12px}
.review-item.right{border-right:4px solid var(--ok)}
.review-item.wrong{border-right:4px solid var(--danger)}
.review-item.pending{border-right:4px solid var(--warn)}

/* ════════════ تب‌ها ════════════ */
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:11px 16px;font-weight:800;font-size:12.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.active{color:var(--text);border-color:var(--brand-yellow-strong)}
.tab .tab-count{background:var(--panel-3);border-radius:10px;font-size:10px;padding:1px 8px;margin-right:6px}

/* ════════════ نمودار میله‌ای گزارش ════════════ */
.bar-row{display:grid;grid-template-columns:130px 1fr 52px;align-items:center;gap:10px;margin:10px 0;font-size:12px}
.bar-track{height:22px;background:var(--panel-3);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--brand-navy-2),var(--brand-navy));border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;color:#f2c959;font-size:10.5px;font-weight:800;min-width:28px;transition:width .8s ease}
[data-theme="dark"] .bar-fill{background:linear-gradient(90deg,#f2c959,#dda92e);color:#2c230a}

/* ════════════ اعلانات ════════════ */
.ann-item{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.ann-item .ann-ic{width:38px;height:38px;border-radius:11px;background:var(--brand-yellow-soft);color:var(--primary-hover);display:grid;place-items:center;flex:0 0 auto}
.ann-item h5{margin:0;font-size:12px}
.ann-item p{margin:3px 0 0;color:var(--muted);font-size:11px}
.ann-item time{font-size:10px;color:var(--muted)}

/* ════════════ فعالیت‌ها ════════════ */
.activity{display:grid;gap:0}
.activity-row{display:flex;gap:10px;align-items:baseline;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:11.5px}
.activity-row:last-child{border-bottom:0}
.activity-row time{color:var(--muted);font-size:10px;white-space:nowrap}

/* ════════════ کارت عمومی پنل ════════════ */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.grid-sidebar{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}

/* ════════════ toast ════════════ */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--brand-navy);color:#fdf6dd;padding:11px 20px;border-radius:13px;font-size:12.5px;font-weight:700;
  z-index:80;transition:.3s;max-width:min(480px,90vw);box-shadow:var(--shadow-lg);text-align:center;
}
[data-theme="dark"] .toast{background:var(--brand-yellow);color:#2c230a}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--danger);color:#fff}

/* ════════════ ریسپانسیو ════════════ */
@media(max-width:1180px){
  .teams,.items{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-sidebar{grid-template-columns:1fr}
}
@media(max-width:1024px){
  :root{--sidebar-w:230px}
  .teams,.items{grid-template-columns:repeat(2,1fr)}
  .hero-progress{display:none}
}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  #sidebar{position:fixed;right:0;top:0;bottom:0;width:272px;height:100vh;transform:translateX(110%);transition:transform .28s ease;box-shadow:var(--shadow-lg)}
  [dir="rtl"] #sidebar{transform:translateX(110%)}
  #sidebar.open{transform:translateX(0)}
  .only-mobile{display:inline-grid}
  main{padding:16px 14px 32px}
  .search input{width:100%}
  .search kbd{display:none}
  .topbar{flex-wrap:wrap}
  .topbar-end{width:100%;order:3}
  .search{flex:1}
  .items{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .teams,.items{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{padding:12px}
  .stat .stat-num{font-size:20px}
  .hero{padding:20px}
  .hero h2{font-size:18px}
  .form-grid{grid-template-columns:1fr}
  .pstep{grid-template-columns:46px 1fr;grid-auto-rows:auto}
  .pstep-actions{grid-column:1/-1;justify-content:flex-start}
  .bar-row{grid-template-columns:90px 1fr 46px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
[hidden]{display:none!important}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.login-card{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:32px;display:grid;gap:10px}
.login-brand img{width:48px;height:48px;object-fit:contain}.login-card h1{font-size:20px;margin:8px 0 0}.login-card p{color:var(--muted);margin:0 0 12px;font-size:13px}.login-card label{font-size:12px;font-weight:700}.login-card input{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}.login-card input:focus{border-color:var(--primary)}.login-card button{margin-top:10px}.login-error{padding:10px;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-size:12px}
</style>

<section id="loginScreen" class="login-screen" aria-label="ورود به آکادمی">

</section>
<div class="app" id="appRoot" hidden>

        <strong>آکادمی یادگیری</strong>

          <small id="sideRole">…</small>
        </div>
        <span class="side-user-arrow" aria-hidden="true">‹</span>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button">
        <span class="tt-icon" id="themeIcon">☾</span>
        <span id="themeLabel">تغییر به حالت تاریک</span>
      </button>
      <button class="theme-toggle" id="logoutBtn" type="button">خروج از حساب</button>
      <div class="side-foot">BimeBazar Learning Academy<br><span>© ۱۴۰۵ بیمه‌بازار — استفاده داخلی</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <!-- ══════════ محتوا ══════════ -->
  <main id="mainCol">

      <div class="topbar-start">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="باز کردن منو">≡</button>
        <div class="welcome">
          <h1 id="topTitle">داشبورد</h1>
          <small id="topSub">سامانه آموزش و آنبوردینگ بیمه‌بازار</small>
        </div>

          <kbd>/</kbd>
        </label>
        <button class="icon-btn bell" id="bellBtn" aria-label="اعلانات">
          <span aria-hidden="true">🔔</span>
          <span class="bell-badge" id="bellBadge" hidden>0</span>
        </button>

    </header>

    <div id="view" class="view" aria-live="polite"></div>
  </main>
</div>

<!-- ══════════ مودال عمومی ══════════ -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-hidden="true">

<script>
window.AdminQuiz = (() => {
  'use strict';
  function render(root, A) {
    return A.callServer('adminListQuizzes').then(r => {
      const list = r.quizzes || [];
      root.innerHTML = '<div class="panel"><div class="section-head"><h3>آزمون‌ها</h3><button class="btn btn-primary" id="createQuiz">+ آزمون جدید</button></div><p class="hint">پس از ثبت اولین تلاش، تنظیمات و سؤال‌ها قفل می‌شوند؛ برای تغییر یک آزمون جدید بسازید. برای اتصال آزمون به مسیر از بخش مسیرهای آموزشی استفاده کنید.</p><div class="table-wrap"><table class="data"><thead><tr><th>عنوان</th><th>تیم</th><th>سؤال</th><th>حدنصاب</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>'+list.map((q,i)=>'<tr><td>'+A.esc(q.title)+'</td><td>'+A.esc(((A.state.teams||[]).find(t=>t.key===q.teamKey)||{}).name||q.teamKey||'قدیمی: تعیین نشده')+'</td><td>'+A.fmtNum(q.questionCount)+'</td><td>'+A.fmtNum(q.passScore)+'٪</td><td>'+(q.active?'فعال':'غیرفعال')+'</td><td><button class="btn btn-soft btn-sm" data-questions="'+i+'">سؤال‌ها</button> <button class="btn btn-soft btn-sm" data-edit="'+i+'">تنظیمات</button> <button class="btn btn-danger btn-sm" data-disable="'+i+'">غیرفعال</button></td></tr>').join('')+'</tbody></table></div><div id="quizQuestions"></div></div>';
      root.querySelector('#createQuiz').onclick=()=>quizForm(null);
      root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>quizForm(list[+b.dataset.edit]));
      root.querySelectorAll('[data-questions]').forEach(b=>b.onclick=()=>questions(list[+b.dataset.questions]));
      root.querySelectorAll('[data-disable]').forEach(b=>b.onclick=()=>A.confirmModal({message:'آزمون غیرفعال شود؟',danger:true,onConfirm:()=>A.callServer('adminDeleteQuiz',list[+b.dataset.disable].quizId).then(()=>render(root,A)).catch(e=>A.toast(e.message,'error'))}));
      function quizForm(q) {
        q=q||{};
        A.openModal({title:q.quizId?'تنظیمات آزمون':'آزمون جدید',bodyHTML:'<form class="form-grid"><div class="form-field full"><label>عنوان</label><input name="title" required value="'+A.esc(q.title||'')+'"></div><div class="form-field full"><label>تیم آزمون</label><select name="teamKey" required><option value="">انتخاب تیم</option>'+ (A.state.teams||[]).map(t=>'<option value="'+A.esc(t.key)+'" '+(q.teamKey===t.key?'selected':'')+'>'+A.esc(t.name)+'</option>').join('')+'</select></div><div class="form-field full"><label>توضیحات</label><textarea name="description">'+A.esc(q.description||'')+'</textarea></div><div class="form-field"><label>حدنصاب درصد</label><input name="passScore" type="number" min="1" max="100" required value="'+A.esc(q.passScore||80)+'"></div><div class="form-field"><label>زمان به دقیقه (صفر: نامحدود)</label><input name="timeLimitMin" type="number" min="0" max="350" value="'+A.esc(q.timeLimitMin||0)+'"></div><div class="form-field"><label>حداکثر تلاش (صفر: نامحدود)</label><input name="maxAttempts" type="number" min="0" value="'+A.esc(q.maxAttempts||0)+'"></div><div class="form-field"><label>نمایش پاسخ صحیح</label><select name="showAnswers">'+[['always','همیشه'],['after_pass','پس از قبولی'],['never','هرگز']].map(x=>'<option value="'+x[0]+'" '+(q.showAnswers===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></div><div class="form-field full"><label>فایل منبع Drive (اختیاری)</label><input name="refId" value="'+A.esc(q.refId||'')+'"><button type="button" class="btn btn-soft btn-sm" id="chooseQuizFile">انتخاب از کتابخانه تیم</button><div id="quizFilePicker"></div></div><label class="check-row"><input type="checkbox" name="shuffleQuestions" '+(q.shuffleQuestions?'checked':'')+'> ترتیب تصادفی سؤال</label><label class="check-row"><input type="checkbox" name="shuffleOptions" '+(q.shuffleOptions?'checked':'')+'> ترتیب تصادفی گزینه</label><label class="check-row"><input type="checkbox" name="active" '+(q.active!==false?'checked':'')+'> فعال</label></form>',footHTML:'<button class="btn btn-soft" data-close>انصراف</button><button class="btn btn-primary" id="saveQuiz">ذخیره</button>',onMount:(m,f)=>{m.querySelector('#chooseQuizFile').onclick=()=>{const form=m.querySelector('form'),team=form.elements.teamKey.value,mount=m.querySelector('#quizFilePicker');if(!team){A.toast('ابتدا تیم را انتخاب کنید','error');return}A.renderLibraryBrowser(mount,{teamKey:team,embedded:true,selectFile:(id,name)=>{form.elements.refId.value=id;mount.innerHTML='';A.toast('فایل انتخاب شد: '+name)}})};f.querySelector('#saveQuiz').onclick=()=>{const form=m.querySelector('form');if(!form.reportValidity())return;const d=new FormData(form), ref=String(d.get('refId')||'').trim(); const payload={quizId:q.quizId||'',teamKey:d.get('teamKey'),title:d.get('title'),description:d.get('description'),passScore:+d.get('passScore'),timeLimitMin:+d.get('timeLimitMin'),maxAttempts:+d.get('maxAttempts'),showAnswers:d.get('showAnswers'),refType:ref?'drive':'standalone',refId:ref,shuffleQuestions:form.elements.shuffleQuestions.checked,shuffleOptions:form.elements.shuffleOptions.checked,active:form.elements.active.checked};A.callServer('adminSaveQuiz',payload).then(()=>{A.closeModal();A.toast('آزمون ذخیره شد');render(root,A)}).catch(e=>A.toast(e.message,'error'));};}});
      }
      function questions(q) {
        const mount=root.querySelector('#quizQuestions');mount.innerHTML=A.loadingHTML();
        A.callServer('adminGetQuiz',q.quizId).then(r=>{
          const rows=r.questions||[];
          mount.innerHTML='<div class="section-head"><h3>سؤال‌های '+A.esc(q.title)+'</h3><div><label class="btn btn-soft btn-sm">ورود ۱۰ سؤال XLSX / CSV<input type="file" id="importQuestions" accept=".xlsx,.csv" hidden></label> <button class="btn btn-primary btn-sm" id="newQuestion">+ سؤال</button></div></div><div class="table-wrap"><table class="data"><thead><tr><th>ترتیب</th><th>سؤال</th><th>نوع</th><th>نمره</th><th>عملیات</th></tr></thead><tbody>'+rows.map((x,i)=>'<tr><td>'+A.fmtNum(x.order)+'</td><td>'+A.esc(x.text)+'</td><td>'+A.esc(x.type)+'</td><td>'+A.fmtNum(x.points)+'</td><td><button class="btn btn-soft btn-sm" data-qedit="'+i+'">ویرایش</button> <button class="btn btn-danger btn-sm" data-qdelete="'+i+'">حذف</button></td></tr>').join('')+'</tbody></table></div>';
          const importer=mount.querySelector('#importQuestions');
          importer.onchange=()=>{const file=importer.files&&importer.files[0];if(!file)return;if(file.size>1024*1024){A.toast('حداکثر حجم یک مگابایت است','error');importer.value='';return;}
            A.confirmModal({title:'ورود سؤال',message:'برای آزمون بدون سؤال، دقیقاً ۱۰ سؤال با منبع یکسان وارد می‌شود. برای XLSX فایل موقت در Drive ایجاد و حذف می‌شود. ادامه می‌دهید؟',onConfirm:()=>{const reader=new FileReader();importer.disabled=true;reader.onerror=()=>{importer.disabled=false;importer.value='';A.toast('خواندن فایل ناموفق بود','error')};reader.onload=()=>A.callServer('adminImportQuestions',q.quizId,file.name,String(reader.result).split(',')[1]||'').then(r=>{A.toast(A.fmtNum(r.count)+' سؤال وارد شد');questions(q)}).catch(e=>A.toast(e.message,'error')).finally(()=>{importer.disabled=false;importer.value=''});reader.readAsDataURL(file);}});
          };
          mount.querySelector('#newQuestion').onclick=()=>questionForm(null);
          mount.querySelectorAll('[data-qedit]').forEach(b=>b.onclick=()=>questionForm(rows[+b.dataset.qedit]));
          mount.querySelectorAll('[data-qdelete]').forEach(b=>b.onclick=()=>A.confirmModal({message:'سؤال حذف شود؟',danger:true,onConfirm:()=>A.callServer('adminDeleteQuestion',rows[+b.dataset.qdelete].questionId).then(()=>questions(q)).catch(e=>A.toast(e.message,'error'))}));
        }).catch(e=>{mount.innerHTML=A.errorHTML(e.message)});
        function questionForm(x) {
          x=x||{};
          A.openModal({title:x.questionId?'ویرایش سؤال':'سؤال جدید',bodyHTML:'<form class="form-grid"><div class="form-field full"><label>متن سؤال یا سناریو</label><textarea name="text" required>'+A.esc(x.text||'')+'</textarea></div><div class="form-field"><label>نوع</label><select name="type">'+[['mcq','چهارگزینه‌ای'],['multi','چندانتخابی'],['tf','درست / غلط'],['essay','تشریحی'],['scenario','سناریومحور']].map(a=>'<option value="'+a[0]+'" '+(x.type===a[0]?'selected':'')+'>'+a[1]+'</option>').join('')+'</select></div><div class="form-field"><label>ترتیب</label><input type="number" name="order" min="1" value="'+A.esc(x.order||1)+'"></div><div class="form-field"><label>نمره</label><input type="number" name="points" min="0.1" step="0.1" required value="'+A.esc(x.points||1)+'"></div><div class="form-field full"><label>گزینه‌ها، هر گزینه در یک خط (برای تشریحی و درست/غلط لازم نیست)</label><textarea name="options">'+A.esc((x.options||[]).join('\n'))+'</textarea></div><div class="form-field full"><label>شماره گزینه صحیح؛ چندانتخابی با ویرگول جدا شود. درست = ۱، غلط = ۲</label><input name="correct" value="'+A.esc((x.correct||[]).map(v=>Number(v)+1).join(','))+'"></div><div class="form-field full"><label>سطح</label><input name="difficulty" value="'+A.esc(x.difficulty||'')+'"></div><div class="form-field full"><label>توضیح پاسخ</label><textarea name="explanation">'+A.esc(x.explanation||'')+'</textarea></div><div class="form-field full"><label>مکان مستند در منبع</label><input name="sourceLocation" value="'+A.esc(x.sourceLocation||'')+'"></div></form>',footHTML:'<button class="btn btn-soft" data-close>انصراف</button><button class="btn btn-primary" id="saveQuestion">ذخیره</button>',onMount:(m,f)=>{f.querySelector('#saveQuestion').onclick=()=>{const form=m.querySelector('form');if(!form.reportValidity())return;const d=new FormData(form),type=d.get('type'),options=String(d.get('options')||'').split('\n').map(s=>s.trim()).filter(Boolean),raw=String(d.get('correct')||'').trim();if(type!=='essay'&&!/^\d+(\s*,\s*\d+)*$/.test(raw)){A.toast('شماره پاسخ صحیح را وارد کنید','error');return} const correct=raw?raw.split(',').map(n=>Number(n.trim())-1):[];if((type==='mcq'&&options.length!==4)||(type==='tf'&&(correct.length!==1||correct[0]<0||correct[0]>1))||(['mcq','scenario'].includes(type)&&correct.length!==1)){A.toast('تعداد گزینه‌ها یا پاسخ صحیح نامعتبر است','error');return}A.callServer('adminSaveQuestion',{quizId:q.quizId,questionId:x.questionId||'',text:d.get('text'),type,order:+d.get('order'),points:+d.get('points'),options,correct,difficulty:d.get('difficulty'),explanation:d.get('explanation'),sourceLocation:d.get('sourceLocation')}).then(()=>{A.closeModal();A.toast('سؤال ذخیره شد');questions(q)}).catch(e=>A.toast(e.message,'error'));};}});
        }
      }
    });
  }
  function review(root,A) {
    return A.callServer('adminListAttempts',{status:'pending_review'}).then(r=>{
      const attempts=r.attempts||[];
      root.innerHTML='<div class="panel"><div class="section-head"><h3>پاسخ‌های در انتظار بازبینی</h3><span class="hint">حداکثر ۲۰۰ مورد آخر</span></div>'+(attempts.length?'<div class="table-wrap"><table class="data"><thead><tr><th>کارشناس</th><th>آزمون</th><th>تاریخ</th><th></th></tr></thead><tbody>'+attempts.map((a,i)=>'<tr><td>'+A.esc(a.userName)+'<br>'+A.esc(a.email)+'</td><td>'+A.esc(a.quizTitle)+'</td><td>'+A.fmtDateTime(a.timestamp)+'</td><td><button class="btn btn-primary btn-sm" data-review="'+i+'">بازبینی</button></td></tr>').join('')+'</tbody></table></div>':A.emptyHTML('✓','تلاشی در انتظار بازبینی نیست',''))+'</div>';
      root.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>open(attempts[+b.dataset.review]));
      function open(a) {
        A.openModal({title:'بازبینی آزمون',size:'lg',bodyHTML:A.loadingHTML()});
        A.callServer('adminGetAttemptDetail',a.attemptId).then(r=>{
          const map={};(r.attempt.answers||[]).forEach(x=>map[x.questionId]=x.value);const essays=(r.questions||[]).filter(q=>q.type==='essay');
          A.openModal({title:'بازبینی '+A.esc(a.userName),size:'lg',bodyHTML:'<form id="reviewForm">'+essays.map((q,i)=>'<div class="form-field"><label>'+A.esc(q.text)+' (حداکثر '+A.fmtNum(q.points)+')</label><p style="white-space:pre-wrap">'+A.esc(map[q.questionId]||'بدون پاسخ')+'</p><input type="number" name="mark'+i+'" min="0" max="'+q.points+'" step="0.1" required placeholder="نمره"></div>').join('')+'<div class="form-field"><label>بازخورد</label><textarea name="feedback"></textarea></div></form>',footHTML:'<button class="btn btn-soft" data-close>انصراف</button><button class="btn btn-primary" id="saveReview">ثبت نمره</button>',onMount:(m,f)=>{f.querySelector('#saveReview').onclick=()=>{const form=m.querySelector('form');if(!form.reportValidity())return;const marks={};essays.forEach((q,i)=>marks[q.questionId]=Number(form.elements['mark'+i].value));A.callServer('adminReviewAttempt',a.attemptId,marks,form.elements.feedback.value).then(()=>{A.closeModal();A.toast('بازبینی ثبت شد');review(root,A)}).catch(e=>A.toast(e.message,'error'));};}});
        }).catch(e=>A.openModal({title:'خطا',bodyHTML:A.errorHTML(e.message)}));
      }
    });
  }
  return {render, review};
})();
</script>

<script>
/* ════════════════════════════════════════════════════════════
   پنل مدیریت — BimeBazar Learning Academy
   تب‌ها بر اساس نقش: admin / team_manager / mentor
   ════════════════════════════════════════════════════════════ */
window.Admin = (() => {
  'use strict';

  function render(container, A) {
    const u = A.state.user;
    const canManage = u.role === 'admin' || (u.role === 'team_manager' && u.canManage);
    const tabs = [];
    if (u.role === 'admin' || u.role === 'team_manager') {
      tabs.push({ key: 'reports', label: 'گزارش عملکرد' });
      tabs.push({ key: 'incomplete', label: 'تکمیل‌نشده‌ها' });
    }

    if (u.role === 'admin') { tabs.push({ key: 'users', label: 'دسترسی‌ها' }); tabs.push({ key: 'content', label: 'مسیرهای آموزشی' }); tabs.push({ key: 'quizzes', label: 'آزمون‌ها' }); tabs.push({ key: 'review', label: 'بازبینی آزمون' }); tabs.push({ key: 'announcements', label: 'اطلاعیه‌ها' }); }




    if (!tabs.length) { container.innerHTML = A.emptyHTML('⚠', 'پنل منتور هنوز تکمیل نشده است', 'این قابلیت برای استفاده عملیاتی آماده نیست.'); return; }
    const activeTab = (render._tab && tabs.some(t => t.key === render._tab)) ? render._tab : tabs[0].key;

    container.innerHTML =
      '<div class="section-head"><h3>پنل مدیریت</h3><small>نقش شما: ' + esc2(A, u.roleLabel || u.role) + ' — تمام عملیات سرور-ساید بررسی مجوز می‌شوند</small></div>'
      + '<div class="tabs" id="adminTabs" role="tablist">' + tabs.map(t => '<button class="tab' + (t.key === activeTab ? ' active' : '') + '" data-tab="' + t.key + '">' + esc2(A, t.label) + '</button>').join('') + '</div>'
      + '<div id="adminBody"></div>';

    const body = container.querySelector('#adminBody');
    const activate = (key) => {
      render._tab = key;
      container.querySelectorAll('#adminTabs .tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === key));
      body.innerHTML = A.loadingHTML('در حال بارگذاری…');
      Promise.resolve(TAB_RENDERERS[key](body, A)).catch(err => {
        body.innerHTML = A.errorHTML(err.message, true);
        const rb = body.querySelector('#retryBtn'); if (rb) rb.addEventListener('click', () => activate(key));
      });
    };
    container.querySelectorAll('#adminTabs .tab').forEach(b => b.addEventListener('click', () => activate(b.getAttribute('data-tab'))));
    activate(activeTab);
  }
  const esc2 = (A, s) => A.esc(s);

  function splitTeams(s) { return (Array.isArray(s) ? s : String(s || '').split(',')).map(x => String(x).trim()).filter(Boolean); }

  /* ══════════ خروجی CSV با fallback ══════════ */
  function downloadCsv(A, resp) {
    try {
      const bin = atob(resp.csvBase64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = resp.filename || 'report.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      A.toast('فایل خروجی دانلود شد');
    } catch (e) {
      const text = decodeURIComponent(escape(atob(resp.csvBase64)));
      A.openModal({
        title: 'خروجی CSV (کپی دستی)',
        bodyHTML: '<p class="hint">دانلود خودکار در این محیط ممکن نشد؛ متن زیر را کپی کنید و در اکسل باز کنید:</p><textarea class="essay-box" style="min-height:220px;direction:ltr;text-align:left" readonly>' + A.esc(text) + '</textarea>',
        footHTML: '<button class="btn btn-primary" data-close>بستن</button>'
      });
    }
  }

  /* ══════════ تب: گزارش عملکرد ══════════ */
  function renderReports(body, A) {
    return A.callServer('reportSummary', '').then(resp => {
      const teams = resp.teams || [], totals = resp.totals || {};
      let html = '<div class="stats" style="margin-bottom:16px">'
        + A.statCard('accent', '👥', 'اعضای فعال', A.fmtNum(totals.members), 'در تیم‌های مجاز شما')
        + A.statCard('ok', '★', 'میانگین نمره', A.fmtNum(totals.avgScore) + '٪', 'در همه تیم‌ها')
        + A.statCard('warn', '✎', 'در انتظار بازبینی', A.fmtNum(totals.pendingReview), 'نیازمند اقدام منتور/مدیر')
        + '</div>';

      html += '<div class="grid-2"><div class="panel"><div class="section-head" style="margin:0 0 12px"><h3>میانگین پیشرفت تیم‌ها (%)</h3></div>'
        + teams.map(t => '<div class="bar-row"><span>تیم ' + A.esc(t.name) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + t.avgCompletion + '%">' + A.fmtNum(t.avgCompletion) + '٪</div></div><span>' + A.fmtNum(t.members) + ' عضو</span></div>').join('')
        + '</div><div class="panel"><div class="section-head" style="margin:0 0 12px"><h3>میانگین نمره آزمون (%)</h3></div>'
        + teams.map(t => '<div class="bar-row"><span>تیم ' + A.esc(t.name) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + t.avgScore + '%">' + (t.scoredAttempts ? A.fmtNum(t.avgScore) + '٪' : 'آزمون نداده') + '</div></div><span>' + A.fmtNum(t.attempts) + ' تلاش</span></div>').join('')
        + '</div></div>';

      html += '<div class="panel" style="margin-top:16px"><div class="section-head" style="margin:0 0 12px"><h3>خلاصه تیم‌ها</h3>'
        + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-soft btn-sm" id="csvSummary">⬇ خروجی Excel (خلاصه تیم‌ها)</button><button class="btn btn-soft btn-sm" id="csvProgress">⬇ خروجی Excel (پیشرفت اعضا)</button></div>'
        + '</div><div class="table-wrap"><table class="data"><thead><tr><th>تیم</th><th>اعضا</th><th>میانگین تکمیل</th><th>تکمیل‌شده کامل</th><th>تلاش آزمون</th><th>میانگین نمره</th><th>قبول</th><th>بازبینی</th></tr></thead><tbody>'
        + teams.map(t => '<tr style="cursor:pointer" data-drilldown="' + A.esc(t.key) + '" title="مشاهده اعضا"><td><strong>تیم ' + A.esc(t.name) + '</strong></td><td>' + A.fmtNum(t.members) + '</td><td>' + A.fmtNum(t.avgCompletion) + '٪</td><td>' + A.fmtNum(t.completedMembers) + '</td><td>' + A.fmtNum(t.attempts) + '</td><td>' + (t.scoredAttempts ? A.fmtNum(t.avgScore) + '٪' : 'آزمون نداده') + '</td><td>' + A.fmtNum(t.passedAttempts) + '</td><td>' + A.fmtNum(t.pendingReview) + '</td></tr>').join('')
        + '</tbody></table></div><div id="drilldown" style="margin-top:16px"></div></div>';

      body.innerHTML = html;
      body.querySelector('#csvSummary').addEventListener('click', () => A.callServer('reportExportCsv', 'team_summary', '').then(r => downloadCsv(A, r)).catch(e => A.toast(e.message, 'error')));
      body.querySelector('#csvProgress').addEventListener('click', () => A.callServer('reportExportCsv', 'user_progress', '').then(r => downloadCsv(A, r)).catch(e => A.toast(e.message, 'error')));
      body.querySelectorAll('[data-drilldown]').forEach(row => row.addEventListener('click', () => renderMembersDrilldown(body.querySelector('#drilldown'), A, row.getAttribute('data-drilldown'))));
    });
  }

  function renderMembersDrilldown(mount, A, teamKey) {
    mount.innerHTML = A.loadingHTML('دریافت وضعیت اعضا…');
    A.callServer('reportTeamMembers', teamKey).then(resp => {
      const members = resp.members || [];
      mount.innerHTML = '<h4 style="margin:0 0 8px;font-size:13px">اعضای تیم — برای مشاهده کارنامه کامل و ثبت بازخورد، روی نام کلیک کنید</h4>'
        + (members.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>نام</th><th>ایمیل</th><th>پیشرفت</th><th>تلاش‌ها</th><th>میانگین نمره</th><th>آخرین فعالیت</th></tr></thead><tbody>'
          + members.map(m => '<tr style="cursor:pointer" data-member="' + A.esc(m.email) + '"><td><strong>' + A.esc(m.name) + '</strong></td><td class="hint">' + A.esc(m.email) + '</td><td><div class="progress-bar" style="min-width:120px"><div class="progress-fill" style="width:' + m.completion + '%"></div></div><span class="hint">' + A.fmtNum(m.completion) + '٪ (' + A.fmtNum(m.itemsDone) + '/' + A.fmtNum(m.itemsTotal) + ')</span></td><td>' + A.fmtNum(m.attempts) + '</td><td>' + (m.scoredAttempts ? A.fmtNum(m.avgScore) + '٪' : 'آزمون نداده') + '</td><td class="hint">' + A.fmtDateTime(m.lastActivity) + '</td></tr>').join('')
          + '</tbody></table></div>' : A.emptyHTML('👥', 'عضوی در این تیم ثبت نشده است', ''));
      mount.querySelectorAll('[data-member]').forEach(row => row.addEventListener('click', () => openMemberModal(A, row.getAttribute('data-member'))));
    }).catch(err => { mount.innerHTML = A.errorHTML(err.message, true); });
  }

  /* ══════════ مودال کارنامه کامل یک نفر + بازخورد منتور ══════════ */
  function openMemberModal(A, email) {
    A.openModal({ title: 'کارنامه عضو', size: 'xl', bodyHTML: A.loadingHTML('دریافت کارنامه…') });
    A.callServer('reportMember', email).then(resp => {
      const m = resp.member, paths = resp.paths || [], attempts = resp.attempts || [], notes = resp.notes || [];
      const u = A.state.user;
      const isMentee = m.mentorEmail === u.email;
      const canNote = u.role === 'admin' || u.role === 'team_manager' || isMentee;

      let html = '<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><div class="avatar" style="width:56px;height:56px;font-size:19px">' + A.esc((m.name || m.email).trim()[0] || '؟') + '</div><div><h4 style="margin:0">' + A.esc(m.name) + '</h4><div class="hint">' + A.esc(m.email) + ' • ' + A.esc((m.teams || []).join('، ')) + '</div></div></div>';

      html += '<h4 style="font-size:13px;margin:14px 0 8px">پیشرفت در مسیرها</h4>';
      html += paths.length ? paths.map(p => '<div class="pstep-meta" style="display:flex;justify-content:space-between;gap:10px;margin:6px 0"><span>' + A.esc(p.title) + '</span><span>' + A.fmtNum(p.percent) + '٪ (' + A.fmtNum(p.done) + '/' + A.fmtNum(p.total) + ')</span></div>' + A.progressHTML(p.percent)).join('') : '<p class="hint">مسیری برای این عضو تعریف نشده است.</p>';

      html += '<h4 style="font-size:13px;margin:16px 0 8px">جزئیات مراحل ثبت‌شده</h4>' + paths.map(p => '<div><strong>' + A.esc(p.title) + '</strong>' + (p.items || []).map(item => '<div class="hint">' + (item.done ? '✓ تکمیل‌شده — ' : '○ تکمیل‌نشده — ') + A.esc(item.title) + '</div>').join('') + '</div>').join('');

      html += '<h4 style="font-size:13px;margin:16px 0 8px">تلاش‌های آزمون (' + A.fmtNum(attempts.length) + ')</h4>';
      html += attempts.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>آزمون</th><th>تاریخ</th><th>نمره</th><th>نتیجه</th></tr></thead><tbody>'
        + attempts.map(a => '<tr><td>' + A.esc(a.quizTitle) + '</td><td>' + A.fmtDateTime(a.timestamp) + '</td><td><strong>' + A.fmtNum(a.score) + '٪</strong></td><td>' + (a.passed ? '<span class="tag tag-ok">قبول</span>' : '<span class="tag tag-danger">رد</span>') + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="hint">تلاش آزمونی ثبت نشده است.</p>';

      if (u.role === 'admin' && m.teams && m.teams.length) html += '<h4 style="font-size:13px;margin:16px 0 8px">فایل‌های تیم و وضعیت ثبت‌شده</h4><p class="hint">تکمیل بر اساس ثبت دستی کارشناس است، نه تأیید مشاهده واقعی.</p><div id="memberFiles"></div>';

      html += '<h4 style="font-size:13px;margin:16px 0 8px">بازخورد منتور (' + A.fmtNum(notes.length) + ')</h4>';
      html += notes.length ? '<div style="display:grid;gap:8px">' + notes.map(n => '<div class="ann-item"><div class="ann-ic">🗒</div><div style="min-width:0"><p style="margin:0;color:var(--text);font-size:12px">' + A.esc(n.note) + '</p><time>' + A.fmtDateTime(n.timestamp) + ' — ' + A.esc(n.mentorEmail) + '</time></div></div>').join('') + '</div>' : '<p class="hint">هنوز بازخوردی ثبت نشده است.</p>';

      if (canNote) {
        html += '<form id="noteForm" style="margin-top:12px;display:flex;gap:8px"><input name="note" class="filter" style="flex:1" placeholder="بازخورد خود را بنویسید…" required><button class="btn btn-navy btn-sm" type="submit">ثبت بازخورد</button></form>';
      }

      const bodyEl = document.querySelector('#modalBody');
      bodyEl.innerHTML = html;
      const filesMount = bodyEl.querySelector('#memberFiles');
      if (filesMount) renderMemberFiles(filesMount, A, email, m.teams[0]);
      const form = bodyEl.querySelector('#noteForm');
      if (form) form.addEventListener('submit', e => {
        e.preventDefault();
        const input = form.querySelector('input[name="note"]');
        const note = input.value.trim();
        if (!note) return;
        A.callServer('addMentorNote', email, note).then(() => { A.toast('بازخورد ثبت شد'); openMemberModal(A, email); }).catch(err => A.toast(err.message, 'error'));
      });
    }).catch(err => { document.querySelector('#modalBody').innerHTML = A.errorHTML(err.message); });
  }

  function renderMemberFiles(mount, A, email, team) {
    let stack=[], tokens=[''], page=0, seq=0;
    function load() {
      const request=++seq, folder=stack.length ? stack[stack.length-1].id : '';
      mount.innerHTML=A.loadingHTML('دریافت فایل‌ها…');
      A.callServer('reportMemberFiles',email,team,folder,tokens[page] || '').then(r=>{
        if(request!==seq || !mount.isConnected)return;
        const items=r.items||[]; if(r.nextPageToken)tokens[page+1]=r.nextPageToken;
        mount.innerHTML='<div class="crumbs"><button id="memberRoot">ریشه تیم</button>'+stack.map((x,i)=>'<span>›</span><button data-crumb="'+i+'">'+A.esc(x.name)+'</button>').join('')+'</div><div class="table-wrap"><table class="data"><thead><tr><th>فایل یا پوشه</th><th>وضعیت</th><th>آزمون</th></tr></thead><tbody>'+items.map((it,i)=>'<tr><td>'+(it.kind==='folder'?'<button class="btn btn-soft btn-sm" data-folder="'+i+'">📁 '+A.esc(it.name)+'</button>':A.esc(it.name))+'</td><td>'+(it.kind==='folder'?'—':it.done?'✓ تکمیل‌شده':'○ ثبت نشده')+'</td><td>'+(!it.quizId?'آزمون ندارد':!it.attempted?'آزمون نداده':it.score===null?'در انتظار نمره':A.fmtNum(it.score)+'٪')+'</td></tr>').join('')+'</tbody></table></div><div class="pagination"><button class="btn btn-soft btn-sm" id="memberPrev" '+(!page?'disabled':'')+'>قبلی</button><span>صفحه '+A.fmtNum(page+1)+'</span><button class="btn btn-soft btn-sm" id="memberNext" '+(!r.nextPageToken?'disabled':'')+'>بعدی</button></div>';
        mount.querySelector('#memberRoot').onclick=()=>{stack=[];tokens=[''];page=0;load()};
        mount.querySelectorAll('[data-crumb]').forEach(b=>b.onclick=()=>{stack=stack.slice(0,+b.dataset.crumb+1);tokens=[''];page=0;load()});
        mount.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.folder];stack.push({id:it.id,name:it.name});tokens=[''];page=0;load()});
        mount.querySelector('#memberPrev').onclick=()=>{if(page){page--;load()}};
        mount.querySelector('#memberNext').onclick=()=>{if(r.nextPageToken){page++;load()}};
      }).catch(e=>{if(request===seq && mount.isConnected)mount.innerHTML=A.errorHTML(e.message)});
    }
    load();
  }

        A.openModal({title:a.id?'ویرایش اطلاعیه':'اطلاعیه جدید',bodyHTML:'<form class="form-grid"><div class="form-field full"><label>عنوان</label><input name="title" required value="'+A.esc(a.title||'')+'"></div><div class="form-field full"><label>متن</label><textarea name="body" required>'+A.esc(a.body||'')+'</textarea></div><div class="form-field full"><label>مخاطب</label><select name="audience">'+audiences.map(x=>'<option value="'+A.esc(x[0])+'" '+((a.audience||'all')===x[0]?'selected':'')+'>'+A.esc(x[1])+'</option>').join('')+'</select></div><label class="check-row"><input type="checkbox" name="active" '+(a.active!==false?'checked':'')+'> فعال</label></form>',footHTML:'<button class="btn btn-soft" data-close>انصراف</button><button class="btn btn-primary" id="saveAnn">ذخیره</button>',onMount:(m,f)=>{f.querySelector('#saveAnn').onclick=()=>{const form=m.querySelector('form');if(!form.reportValidity())return;const d=new FormData(form);A.callServer('adminSaveAnnouncement',{id:a.id||'',title:d.get('title'),body:d.get('body'),audience:d.get('audience'),active:form.elements.active.checked}).then(()=>{A.closeModal();A.state.bootstrap=null;A.toast('اطلاعیه ذخیره شد');renderAnnouncements(body,A)}).catch(e=>A.toast(e.message,'error'));};}});
      }
    });
  }

  const TAB_RENDERERS = { reports: renderReports, incomplete: renderIncomplete, users: renderUsers, content: renderContent, quizzes: window.AdminQuiz.render, review: window.AdminQuiz.review, announcements: renderAnnouncements };

})();

<script>
/* ════════════════════════════════════════════════════════════
   BimeBazar Learning Academy — برنامه فرانت‌اند (SPA)
   ════════════════════════════════════════════════════════════ */
const App = (() => {
  'use strict';

  /* ───────── حالت سراسری ───────── */
  const state = {
    user: null,
    teams: [],
    pageSize: 12,
    view: 'dashboard',
    params: {},
    bootstrap: null,
    theme: 'light',
    library: null,          // { teamKey, folderStack:[], page, pageTokens, nextToken, search, type, reqId }
    quiz: null,             // جلسه آزمون فعال
    timers: [],
    sessionToken: ''
  };

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = ts => { try { if (!ts) return '—'; return new Date(ts).toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return ''; } };
  const fmtDateTime = ts => { try { if (!ts) return '—'; return new Date(ts).toLocaleString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  const fmtNum = n => Number(n || 0).toLocaleString('fa-IR');
  const isDemo = () => !window.google || !window.google.script || !window.google.script.run;
  const initials = s => { const p = String(s || '؟').trim().split(/\s+/); return ((p[0] || '؟')[0] || '؟') + ((p[1] || '')[0] || ''); };
  const clearTimers = () => { state.timers.forEach(t => clearInterval(t)); state.timers = []; };

  /* ───────── پل ارتباطی با بک‌اند ───────── */
  const pendingReads = new Map();
  const readOnly = new Set(['getBootstrap', 'listMyPaths', 'getPath', 'getLibraryPage', 'getMyTranscript', 'listAnnouncements']);
  function callServer(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    const key = readOnly.has(fn) ? JSON.stringify([state.sessionToken, fn, args]) : null;
    if (key && pendingReads.has(key)) return pendingReads.get(key);
    let request;
    if (!isDemo()) {
      request = new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => { const message = (err && err.message) || String(err) || 'خطای ناشناخته در سرور'; if (/نشست ورود/.test(message)) showLogin(message); reject(new Error(message)); })
          .apiRequest(state.sessionToken, fn, args);
      });
    } else {
      request = Promise.reject(new Error('اتصال به سرور Apps Script برقرار نیست. برنامه را از نشانی وب‌اپ منتشرشده باز کنید.')); 
    }
    if (key) { pendingReads.set(key, request); request.then(() => pendingReads.delete(key), () => pendingReads.delete(key)); }
    return request;
  }

  /* ───────── مودال ───────── */
  const overlay = () => $('#overlay');
  function openModal(opts) {
    opts = opts || {};
    $('#modalTitle').innerHTML = opts.title || '';
    const body = $('#modalBody');
    body.innerHTML = opts.bodyHTML || '';
    const foot = $('#modalFoot');
    if (opts.footHTML) { foot.hidden = false; foot.innerHTML = opts.footHTML; }
    else { foot.hidden = true; foot.innerHTML = ''; }
    const box = $('#modalBox');
    box.className = 'modal' + (opts.size ? ' modal-' + opts.size : '');
    overlay().classList.add('open');
    overlay().setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    if (opts.onMount) { try { opts.onMount(body, foot); } catch (e) { console.error(e); } }
    const f = body.querySelector('input,select,textarea,button'); if (f) f.focus();
  }
  function closeModal() {
    overlay().classList.remove('open');
    overlay().setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    clearTimers();
    const body = $('#modalBody'); body.innerHTML = '';
  }
  function confirmModal(opts) {
    opts = opts || {};
    openModal({
      title: esc(opts.title || 'تأیید'),
      bodyHTML: '<div style="font-size:13px;line-height:2">' + (opts.bodyHTML || esc(opts.message || 'مطمئن هستید؟')) + '</div>',
      footHTML: '<button class="btn btn-soft" data-close>انصراف</button><button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" id="confirmYesBtn">' + esc(opts.confirmLabel || 'تأیید') + '</button>',
      onMount: (body, foot) => {
        $('#confirmYesBtn', foot).addEventListener('click', () => { closeModal(); if (opts.onConfirm) opts.onConfirm(); });
      }
    });
  }

  /* ───────── toast ───────── */
  let toastTimer = null;
  function toast(msg, type) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (type === 'error' ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, type === 'error' ? 4200 : 2600);
  }

  /* ───────── ابزارهای رندر ───────── */
  function loadingHTML(text) {
    return '<div class="loading full-span"><div class="spinner"></div><span>' + esc(text || 'در حال بارگذاری…') + '</span></div>';

  function progressHTML(percent) {
    const p = Math.max(0, Math.min(100, Number(percent) || 0));

  const TEAM_COLORS = { blue: '#2f6fed', orange: '#e07b1a', green: '#1a9e6b', purple: '#7c3aed' };

  /* ───────── پوسته: سایدبار و نوار بالا ───────── */
  const NAV = [
    { key: 'dashboard', label: 'داشبورد', icon: 'M3 12l9-8 9 8M5 10v10h14V10', roles: ['admin', 'team_manager', 'mentor', 'learner'] },
    { key: 'teams', label: 'تیم‌های من', icon: 'M4 19a8 8 0 0 1 16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8', roles: ['admin', 'team_manager', 'mentor', 'learner'] },
    { key: 'library', label: 'کتابخانه محتوا', icon: 'M4 5h6v14H4zM14 5h6v14h-6zM4 9h6M14 9h6', roles: ['admin', 'team_manager', 'mentor', 'learner'] },
    { key: 'transcript', label: 'کارنامه من', icon: 'M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 12l2 2 4-4', roles: ['admin', 'team_manager', 'mentor', 'learner'] },
    { key: 'admin', label: 'پنل مدیریت', icon: 'M12 3l8 4v5c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V7z', roles: ['admin'] }
  ];
  const ICONS = {
    folder: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
    file: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5',
    clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2',
    check: 'M4 12l5 5L20 6',
    lock: 'M6 11V8a6 6 0 0 1 12 0v3M5 11h14v10H5z',
    play: 'M8 5v14l11-7z',
    chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
    users: 'M4 19a8 8 0 0 1 16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
    download: 'M12 3v12M6 11l6 6 6-6M4 21h16',
    search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3',
    bell: 'M18 9a6 6 0 1 0-12 0c0 6-2 6-2 8h16c0-2-2-2-2-8M10 21a2 2 0 0 0 4 0'
  };
  const svgIcon = (path, cls) => '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true"><path d="' + path + '"/></svg>';

  function renderSidebar() {
    const role = state.user ? state.user.role : 'learner';
    $('#sideNav').innerHTML = NAV.filter(n => n.roles.indexOf(role) !== -1).map(n =>
      '<button class="nav-item" data-nav="' + n.key + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + n.icon + '"/></svg><span>' + esc(n.label) + '</span></button>'
    ).join('');
    $$('#sideNav .nav-item').forEach(btn => btn.addEventListener('click', () => { go(btn.getAttribute('data-nav')); closeSidebar(); }));

  function openSidebar() { $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); }

  const VIEW_TITLES = { dashboard: ['داشبورد', 'خوش آمدید؛ مسیر یادگیری شما در یک نگاه'], teams: ['تیم‌های من', 'فضای آموزشی مستقل هر تیم'], team: ['تیم', 'مسیرهای یادگیری و محتوای تیم'], library: ['کتابخانه محتوا', 'فایل‌ها و مستندات آموزشی Drive'], path: ['مسیر یادگیری', 'مراحل مرحله‌بندی‌شده با پیشرفت شما'], transcript: ['کارنامه من', 'تاریخچه و نتایج آزمون‌های شما'], admin: ['پنل مدیریت', 'مدیریت کاربران، محتوا، آزمون و گزارش‌ها'] };

  function go(view, params) {
    state.view = view; state.params = params || {};

    const meta = VIEW_TITLES[view] || VIEW_TITLES.dashboard;
    $('#topTitle').textContent = meta[0];

    Promise.resolve(fn(state.params)).catch(err => { viewEl.innerHTML = errorHTML(err.message, true); const rb = $('#retryBtn'); if (rb) rb.addEventListener('click', () => go(view, params)); });
  }

  const VIEWS = {};

  /* ════════════════════════════════════════
     داشبورد
     ════════════════════════════════════════ */

    const b = state.bootstrap || await callServer('getBootstrap');

    const u = b.user, s = b.stats;

    const ann = b.announcements || [];

    const recommended = b.recommended || [];

      + (state.user.role !== 'learner' ? quickBtn('go-admin', '⚙ پنل مدیریت') : '')
      + '</div></section>';

    $('#view').innerHTML = html;
    bindDashboardActions(active);
    return;
  };

  async function renderAdminDashboard(b) {
    const report = await callServer('reportSummary', '');

    const teams = report.teams || [], recent = b.recentActivity || [], ann = b.announcements || [];
