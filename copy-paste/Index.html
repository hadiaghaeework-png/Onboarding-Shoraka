    html += '<section class="stats">' + statCard('gold','👥','کارشناسان فعال',fmtNum(report.totals.members),'بر اساس نام کاربری') + statCard('ok','★','میانگین نمره',fmtNum(report.totals.avgScore)+'٪','تلاش‌های دارای نمره') + '</section>';
    html += '<section class="panel"><div class="section-head"><h3>پیشرفت و نمره تیم‌ها</h3></div><div class="table-wrap"><table class="data"><thead><tr><th>تیم</th><th>کارشناسان فعال</th><th>میانگین پیشرفت مراحل</th><th>میانگین نمره</th><th></th></tr></thead><tbody>' + teams.map(t => '<tr><td>' + esc(t.name) + '</td><td>' + fmtNum(t.members) + '</td><td>' + fmtNum(t.avgCompletion) + '٪</td><td>' + (t.scoredAttempts ? fmtNum(t.avgScore) + '٪' : 'آزمون نداده') + '</td><td><button class="btn btn-soft btn-sm" data-admin-team="' + esc(t.key) + '">جزئیات</button></td></tr>').join('') + '</tbody></table></div></section>';
    html += '<div class="grid-2"><section class="panel"><div class="section-head"><h3>فعالیت‌های اخیر مدیر</h3></div>' + (recent.length ? '<div class="activity">' + recent.map(a => '<div class="activity-row"><time>' + fmtDateTime(a.timestamp) + '</time><span>' + esc(ACTION_LABELS[a.action] || a.action) + (a.detail ? ' — ' + esc(a.detail) : '') + '</span></div>').join('') + '</div>' : '<p class="hint">فعالیتی ثبت نشده است.</p>') + '</section><section class="panel"><div class="section-head"><h3>اطلاعیه‌ها</h3></div>' + (ann.length ? ann.map(a => '<div class="ann-item"><div><h5>' + esc(a.title) + '</h5><p>' + esc(a.body) + '</p></div></div>').join('') : '<p class="hint">اطلاعیه‌ای ثبت نشده است.</p>') + '</section></div>';
    $('#view').innerHTML = html;
    $$('#view [data-admin-team]').forEach(btn => btn.addEventListener('click', () => window.Admin.openTeamReport(window.__app, btn.getAttribute('data-admin-team'))));
  }

  function statCard(kind, icon, label, num, foot) {
    return '<div class="stat ' + kind + '"><span class="stat-ic">' + icon + '</span><span class="stat-label">' + esc(label) + '</span><strong class="stat-num">' + num + '</strong><span class="stat-foot">' + esc(foot) + '</span></div>';
  }
  function quickBtn(action, label) { return '<button class="btn btn-soft" data-action="' + action + '">' + label + '</button>'; }

  function bindDashboardActions(active) {
    $$('#view [data-action]').forEach(btn => btn.addEventListener('click', () => {
      const a = btn.getAttribute('data-action');
      if (a === 'resume-path' && active[0]) go('path', { pathId: active[0].pathId });
      else if (a === 'go-teams') go('teams');
      else if (a === 'go-library') go('library');
      else if (a === 'go-transcript') go('transcript');
      else if (a === 'go-admin') go('admin');
    }));
    $$('#view [data-open-path]').forEach(btn => btn.addEventListener('click', () => go('path', { pathId: btn.getAttribute('data-open-path') })));
  }

  async function paintChrome(b) {
    state.user = b.user;
    const u = b.user;
    $('#sideAvatar').textContent = initials(u.name || u.email);
    $('#sideName').textContent = u.name || u.email;
    $('#sideRole').textContent = u.roleLabel || u.role;
    renderSidebar();
    const unread = (b.notifications || []).filter(n => !n.read).length;
    const badge = $('#bellBadge');
    badge.hidden = !unread; badge.textContent = fmtNum(unread);

  }

  /* ════════════════════════════════════════
     تیم‌ها
     ════════════════════════════════════════ */
  VIEWS.teams = async () => {
    const b = state.bootstrap || await callServer('getBootstrap');
    paintChromeIfNeeded(b);
    const teams = b.teams || [];
    if (!teams.length && b.user.role !== 'admin') {
      $('#view').innerHTML = emptyHTML('🏢', 'برای حساب شما تیمی تعریف نشده است', 'اگر فکر می‌کنید اشتباهی رخ داده، با مدیر سامانه تماس بگیرید.');
      return;
    }
    // آمار هر تیم (مسیرها و پیشرفت) — به‌صورت موازی
    const stats = await Promise.all(teams.map(t =>
      callServer('listMyPaths', t.key).then(r => ({ key: t.key, paths: r.paths || [] }))
    ));
    const byKey = {}; stats.forEach(s => byKey[s.key] = s.paths);

    let html = '<div class="section-head"><h3>تیم‌های در دسترس شما</h3>' + (b.user.role === 'admin' ? '<button class="btn btn-primary btn-sm" id="createTeam">+ ساخت تیم</button>' : '<small>نمایش بر اساس سطح دسترسی — هر تیم فضای آموزشی مستقل دارد</small>') + '</div>'
      + '<div class="teams">' + teams.map(t => {
        const paths = byKey[t.key] || [];
        const totalItems = paths.reduce((s, p) => s + p.total, 0);
        const avg = paths.length ? Math.round(paths.reduce((s, p) => s + p.percent, 0) / paths.length) : 0;
        const color = TEAM_COLORS[t.color] || '#edbe46';
        return '<button class="team-card" data-team="' + esc(t.key) + '" style="--team-accent:' + color + '">'
          + '<div class="team-symbol">' + esc(t.icon || '◈') + '</div>'
          + '<h4>تیم ' + esc(t.name) + '</h4>'
          + '<p>کتابخانه، مسیرهای یادگیری و آزمون‌های اختصاصی تیم ' + esc(t.name) + '</p>'
          + '<div class="team-meta"><span>' + fmtNum(paths.length) + ' مسیر یادگیری</span><span>' + fmtNum(totalItems) + ' مرحله آموزشی</span></div>'
          + '<div class="team-progress"><div class="tp-row"><span>پیشرفت شما در این تیم</span><span>' + fmtNum(avg) + '٪</span></div><div class="tp-bar"><div class="tp-fill" style="width:' + avg + '%"></div></div></div>'
          + '<div class="team-go"><span>ورود به فضای تیم</span><span>←</span></div>'
          + '</button>';
      }).join('') + '</div>';
    $('#view').innerHTML = html;
    $$('#view [data-team]').forEach(btn => btn.addEventListener('click', () => go('team', { teamKey: btn.getAttribute('data-team') })));
    const create = $('#createTeam');
    if (create) create.onclick = () => openModal({title:'ساخت تیم', bodyHTML:'<form id="teamForm" class="form-grid"><div class="form-field full"><label>نام تیم</label><input name="name" required maxlength="80"></div><div class="form-field full"><label>کلید انگلیسی یکتا (غیرقابل تغییر)</label><input name="key" required pattern="[a-zA-Z0-9_-]{2,40}"></div></form>', footHTML:'<button class="btn btn-soft" data-close>انصراف</button><button class="btn btn-primary" id="saveTeam">ساخت تیم و پوشه</button>', onMount:(body,foot)=>{ foot.querySelector('#saveTeam').onclick=()=>{const form=body.querySelector('form');if(!form.reportValidity())return;const d=new FormData(form),btn=foot.querySelector('#saveTeam');btn.disabled=true;callServer('adminCreateTeam',d.get('key'),d.get('name')).then(()=>{closeModal(); state.bootstrap=null;toast('تیم ساخته شد');go('teams');}).catch(e=>{btn.disabled=false;toast(e.message,'error')});};}});

  };

  function paintChromeIfNeeded(b) { if (b && b.user) { state.bootstrap = b; state.teams = b.teams || []; paintChrome(b); } }

  /* ════════════════════════════════════════
     جزئیات تیم (مسیرها + محتوا)
     ════════════════════════════════════════ */
  VIEWS.team = async (params) => {
    const teamKey = params.teamKey;
    const b = state.bootstrap || await callServer('getBootstrap');
    paintChromeIfNeeded(b);
    const team = (b.teams || []).find(t => t.key === teamKey);
    if (!team) { $('#view').innerHTML = errorHTML('به این تیم دسترسی ندارید یا وجود ندارد.'); return; }
    const pathsResp = await callServer('listMyPaths', teamKey);
    const paths = pathsResp.paths || [];
    const tab = params.tab || 'paths';

    let html = '<section class="path-header" style="--team-accent:' + (TEAM_COLORS[team.color] || '#edbe46') + '">'
      + '<div class="team-symbol" style="margin:0;background:color-mix(in srgb,' + (TEAM_COLORS[team.color] || '#edbe46') + ' 16%,var(--panel));color:' + (TEAM_COLORS[team.color] || '#d9a72e') + '">' + esc(team.icon) + '</div>'
      + '<div class="path-header-main"><h2>تیم ' + esc(team.name) + '</h2><p>مسیرهای یادگیری و محتوای آموزشی اختصاصی این تیم</p></div>'
      + '<div class="pstep-actions"><span class="tag tag-muted">' + fmtNum(paths.length) + ' مسیر</span></div>'
      + '</section>';

    html += '<div class="tabs" role="tablist">'
      + '<button class="tab' + (tab === 'paths' ? ' active' : '') + '" data-tab="paths">مسیرهای یادگیری <span class="tab-count">' + fmtNum(paths.length) + '</span></button>'
      + '<button class="tab' + (tab === 'content' ? ' active' : '') + '" data-tab="content">محتوای تیم</button>'
      + '</div>';

    html += '<div id="teamTabBody">';
    if (tab === 'paths') {
      html += paths.length ? '<div style="display:grid;gap:12px">' + paths.map(p =>
        '<div class="pstep" style="grid-template-columns:52px 1fr auto"><div class="pstep-index">' + esc(team.icon) + '</div>'
        + '<div class="pstep-body"><h4>' + esc(p.title) + '</h4><div class="pstep-meta"><span>' + esc(p.description || '') + '</span></div>'
        + '<div class="progress-big" style="margin-top:10px"><div style="flex:1">' + progressHTML(p.percent) + '</div><span class="pb-num">' + fmtNum(p.percent) + '٪</span></div>'
        + '<div class="pstep-meta" style="margin-top:6px"><span>' + fmtNum(p.done) + ' از ' + fmtNum(p.total) + ' مرحله تکمیل شده</span></div>'
        + '</div><div class="pstep-actions"><button class="btn btn-primary btn-sm" data-open-path="' + esc(p.pathId) + '">' + (p.done ? 'ادامه مسیر' : 'شروع مسیر') + '</button></div></div>'
      ).join('') + '</div>' : emptyHTML('🧭', 'هنوز مسیری برای این تیم تعریف نشده است', 'مدیر سامانه می‌تواند از پنل مدیریت مسیر تعریف کند.');
    } else {
      html += '<div id="teamLibraryMount"></div>';
    }
    html += '</div>';

    $('#view').innerHTML = html;
    $$('#view .tab').forEach(btn => btn.addEventListener('click', () => go('team', { teamKey: teamKey, tab: btn.getAttribute('data-tab') })));
    $$('#view [data-open-path]').forEach(btn => btn.addEventListener('click', () => go('path', { pathId: btn.getAttribute('data-open-path') })));
    if (tab === 'content') {
      const mount = $('#teamLibraryMount');
      renderLibraryBrowser(mount, { teamKey: teamKey, embedded: true });
    }
  };

  /* ════════════════════════════════════════
     مرورگر کتابخانه (مشترک: نمای کتابخانه + تب تیم)
     ════════════════════════════════════════ */
  function renderLibraryBrowser(mount, opts) {
    opts = opts || {};
    const embedded = !!opts.embedded;
    const lib = {
      teamKey: opts.teamKey || (state.teams[0] && state.teams[0].key) || 'account',
      folderStack: [],   // [{id,name}]
      page: 1,
      pageTokens: [''],
      nextToken: '',
      search: '',
      type: 'all',
      reqId: 0
    };
    const teams = state.teams || [];
    lib._selectFile = opts.selectFile || null;

    let html = '<div class="library-toolbar">';
    if (!embedded) {
      html += '<select class="filter" id="libTeam" aria-label="انتخاب تیم">' + teams.map(t => '<option value="' + esc(t.key) + '"' + (t.key === lib.teamKey ? ' selected' : '') + '>تیم ' + esc(t.name) + '</option>').join('') + '</select>';
    } else {
      html += '<span class="tag tag-gold">محتوای تیم ' + esc((teams.find(t => t.key === lib.teamKey) || {}).name || lib.teamKey) + '</span>';
    }
    html += '<input class="filter" id="libSearch" type="search" placeholder="جست‌وجو در این پوشه…" style="min-width:180px" aria-label="جست‌وجو">'
      + '<select class="filter" id="libType" aria-label="فیلتر نوع"><option value="all">همه موارد</option><option value="folder">فقط پوشه‌ها</option><option value="file">فقط فایل‌ها</option></select>'
      + (!opts.selectFile && state.user.role === 'admin' ? '<label class="btn btn-primary btn-sm">آپلود فایل <input id="libUpload" type="file" hidden></label>' : '')
      + '<span class="hint" id="libCount" style="margin-inline-start:auto"></span>'
      + '</div>'
      + '<nav class="crumbs" id="libCrumbs" aria-label="مسیر پوشه"></nav>'
      + '<div class="items" id="libItems">' + loadingHTML('در حال دریافت محتوا…') + '</div>'
      + '<div class="pagination"><span id="libInfo">—</span><div class="pages">'
      + '<button id="libPrev" disabled>قبلی</button><span class="page-now" id="libPage">۱</span><button id="libNext" disabled>بعدی</button>'
      + '</div></div>';
    mount.innerHTML = html;

    const itemsEl = $('#libItems', mount), crumbsEl = $('#libCrumbs', mount);
    const teamSel = $('#libTeam', mount), searchEl = $('#libSearch', mount), typeSel = $('#libType', mount);

    function renderCrumbs() {
      const team = (state.teams || []).find(t => t.key === lib.teamKey);
      const rootName = team ? team.name : 'ریشه';
      let out = '<button data-crumb="-1">' + esc(rootName) + '</button>';
      lib.folderStack.forEach((f, i) => { out += '<span class="sep">›</span><button data-crumb="' + i + '">' + esc(f.name) + '</button>'; });
      crumbsEl.innerHTML = out;
      $$('button', crumbsEl).forEach(btn => btn.addEventListener('click', () => {
        const i = parseInt(btn.getAttribute('data-crumb'), 10);
        if (i === -1) lib.folderStack = []; else lib.folderStack = lib.folderStack.slice(0, i + 1);
        lib.page = 1; lib.pageTokens = ['']; load();
      }));
    }

    function currentFolderId() { return lib.folderStack.length ? lib.folderStack[lib.folderStack.length - 1].id : ''; }

    async function load() {
      const reqId = ++lib.reqId;
      itemsEl.innerHTML = loadingHTML('در حال دریافت محتوا…');
      $('#libPrev', mount).disabled = true; $('#libNext', mount).disabled = true;
      renderCrumbs();
      try {
        const resp = await callServer('getLibraryPage', currentFolderId(), lib.pageTokens[lib.page - 1] || '', lib.search, lib.type, lib.teamKey);
        if (reqId !== lib.reqId) return; // پاسخ قدیمی — نادیده بگیر
        const items = resp.items || [];
        lib.nextToken = resp.nextPageToken || '';
        if (lib.nextToken) lib.pageTokens[lib.page] = lib.nextToken;
        $('#libInfo', mount).textContent = 'نمایش ' + fmtNum(items.length) + ' مورد در این صفحه';
        $('#libCount', mount).textContent = items.length ? 'صفحه ' + fmtNum(lib.page) : '';
        $('#libPage', mount).textContent = fmtNum(lib.page);
        $('#libPrev', mount).disabled = lib.page <= 1;
        $('#libNext', mount).disabled = !lib.nextToken;
        if (!items.length) { itemsEl.innerHTML = emptyHTML('🔍', 'محتوایی پیدا نشد', lib.search ? 'عبارت جست‌وجو را تغییر دهید.' : 'این پوشه خالی است.'); return; }
        itemsEl.innerHTML = items.map(item => renderItemCard(item, !!lib._selectFile)).join('');
        $$('.item', itemsEl).forEach(card => wireItemCard(card, lib));
      } catch (err) {
        if (reqId !== lib.reqId) return;
        itemsEl.innerHTML = errorHTML(err.message, true);
        const rb = $('#retryBtn', itemsEl); if (rb) rb.addEventListener('click', load);
      }
    }

    const upload = $('#libUpload', mount);
    if (upload) upload.addEventListener('change', () => {
      const file = upload.files && upload.files[0]; if (!file) return;
      if (file.size > 4*1024*1024) { toast('حداکثر اندازه فایل ۴ مگابایت است.', 'error'); upload.value=''; return; }
      const reader = new FileReader(); upload.disabled = true;
      reader.onerror = () => { upload.disabled=false; upload.value=''; toast('خواندن فایل ممکن نشد.', 'error'); };
      reader.onload = () => { const content=String(reader.result).split(',')[1] || ''; callServer('adminUploadFile',lib.teamKey,currentFolderId(),file.name,file.type || 'application/octet-stream',content).then(()=>{toast('فایل بارگذاری شد');lib.page=1;lib.pageTokens=[''];load();}).catch(e=>toast(e.message,'error')).finally(()=>{upload.disabled=false;upload.value='';}); };
      reader.readAsDataURL(file);
    });
    let searchTimer = null;
    lib._reload = load;
    if (teamSel) teamSel.addEventListener('change', () => { lib.teamKey = teamSel.value; lib.folderStack = []; lib.page = 1; lib.pageTokens = ['']; load(); });
    searchEl.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { lib.search = searchEl.value.trim(); lib.page = 1; lib.pageTokens = ['']; load(); }, 350); });
    typeSel.addEventListener('change', () => { lib.type = typeSel.value; lib.page = 1; lib.pageTokens = ['']; load(); });
    $('#libPrev', mount).addEventListener('click', () => { if (lib.page > 1) { lib.page--; load(); } });
    $('#libNext', mount).addEventListener('click', () => { if (lib.nextToken) { lib.page++; load(); } });

    load();
    return lib;
  }
  function renderItemCard(item, selectMode) {
    const isFolder = item.kind === 'folder';
    const quiz = item.quiz && item.quiz.available;
    const done = item.status === 'completed';
    const iconLabel = isFolder ? '📁' : ({ PDF: 'PDF', VIDEO: '▶ MP4', IMAGE: 'IMG', SHEET: 'XLS', DOC: 'DOC', SLIDES: 'PPT', AUDIO: 'AUD', ARCHIVE: 'ZIP', TEXT: 'TXT', FILE: 'FILE' }[item.icon] || 'FILE');
    return '<article class="item" data-id="' + esc(item.id) + '" data-kind="' + (isFolder ? 'folder' : 'file') + '" data-name="' + esc(item.name) + '" data-url="' + esc(item.url || '') + '" data-preview="' + esc(item.previewUrl || '') + '" data-mime="' + esc(item.mimeType || '') + '" data-quiz="' + (quiz ? esc(item.quiz.quizId || '1') : '') + '" data-size="' + esc(item.size || '') + '" data-modified="' + esc(item.modified || '') + '">'
      + '<span class="status-dot' + (done ? ' done' : '') + '" title="' + (done ? 'تکمیل‌شده' : 'مشاهده نشده') + '"></span>'
      + '<div class="item-top"><div class="file-icon' + (isFolder ? ' folder' : '') + '">' + iconLabel + '</div><span class="tag ' + (isFolder ? 'tag-folder' : 'tag-muted') + '">' + (isFolder ? 'پوشه' : esc(item.icon || 'FILE')) + '</span></div>'
      + '<h4>' + esc(item.name) + '</h4>'
      + (!isFolder ? '<div class="hint">پیشرفت مطالعه: ' + (done ? '۱۰۰٪' : '۰٪') + '</div>' + progressHTML(done ? 100 : 0) : '')
      + '<small>' + (isFolder ? 'ورود به محتوای پوشه' : esc(item.size || 'فایل آموزشی')) + (item.modified ? ' • ' + fmtDate(item.modified) : '') + '</small>'
      + '<div class="item-actions">'
      + (isFolder ? '<button class="btn btn-navy btn-sm" data-act="open">مشاهده پوشه</button>' : selectMode ? '<button class="btn btn-primary btn-sm" data-act="choose">انتخاب فایل</button>' : '<button class="btn btn-soft btn-sm" data-act="preview">پیش‌نمایش</button>')
      + (!selectMode && quiz ? '<button class="btn btn-primary btn-sm" data-act="quiz">شروع آزمون</button>' : '')
      + (!selectMode && state.user.role === 'admin' && !isFolder ? '<button class="btn btn-danger btn-sm" data-act="trash">حذف</button>' : '')
      + '</div></article>';
  }
  function wireItemCard(card, lib) {
    const d = card.dataset;
    const reload = () => { lib.page = 1; lib.pageTokens = ['']; if (lib._reload) lib._reload(); };
    const act = (name) => {
      if (name === 'open') {
        lib.folderStack.push({ id: d.id, name: d.name });
        reload();
      } else if (name === 'choose' && lib._selectFile) {
        lib._selectFile(d.id, d.name);
      } else if (name === 'preview') {
        openItemPreview(d, lib);
      } else if (name === 'trash') {
        confirmModal({title:'انتقال به زباله‌دان',message:'فایل «' + d.name + '» از Drive به زباله‌دان منتقل شود؟',danger:true,onConfirm:()=>callServer('adminTrashFile',lib.teamKey,d.id).then(()=>{toast('فایل به زباله‌دان منتقل شد');reload();}).catch(e=>toast(e.message,'error'))});
      } else if (name === 'quiz') {
        startQuizByRef(d.quiz && d.quiz !== '1' ? d.quiz : null, d, lib);
      }
    };
    $$('[data-act]', card).forEach(btn => btn.addEventListener('click', () => act(btn.getAttribute('data-act'))));
    if (d.kind === 'folder') {
      const h4 = $('h4', card);
      h4.style.cursor = 'pointer';
      h4.addEventListener('click', () => act('open'));
    }
  }

  /* پیش‌نمایش/جزئیات آیتم در مودال */
  function openItemPreview(d, lib) {
    const isDemoMode = isDemo();
    const canPreview = !!d.preview && !isDemoMode;
    openModal({
      title: 'جزئیات فایل',
      size: 'lg',
      bodyHTML:
        '<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:14px"><div class="file-icon" style="width:56px;height:56px;font-size:13px">' + esc((d.mime || '').indexOf('pdf') !== -1 ? 'PDF' : 'FILE') + '</div>'
        + '<div style="min-width:0"><h4 style="margin:0 0 4px;word-break:break-word">' + esc(d.name) + '</h4><div class="hint">' + esc(d.size || 'فایل آموزشی') + (d.modified ? ' • آخرین تغییر: ' + fmtDate(d.modified) : '') + '</div></div></div>'
        + (canPreview
            ? '<iframe src="' + esc(d.preview) + '" title="پیش‌نمایش فایل" style="width:100%;height:380px;border:1px solid var(--line);border-radius:12px;background:#fff" loading="lazy"></iframe>'
            : '<div class="empty" style="padding:26px"><span class="empty-ic">📄</span><h4>' + (isDemoMode ? 'پیش‌نمایش در حالت نمونه فعال نیست' : 'پیش‌نمایش مستقیم پشتیبانی نمی‌شود') + '</h4><p class="hint" style="margin:6px 0 0">برای مشاهده فایل از دکمه «باز کردن در Google Drive» استفاده کنید.</p></div>')
        + '<p class="hint" id="markState" style="margin-top:12px"></p>',
      footHTML:
        (d.url ? '<button class="btn btn-soft" id="openDriveBtn">↗ باز کردن در Google Drive</button>' : '')
        + '<button class="btn btn-soft" id="markDoneBtn">✓ ثبت به‌عنوان تکمیل‌شده</button>'
        + (d.quiz ? '<button class="btn btn-primary" id="itemQuizBtn">شروع آزمون</button>' : ''),
      onMount: (body, foot) => {
        const openBtn = $('#openDriveBtn', foot);
        if (openBtn) openBtn.addEventListener('click', () => window.open(d.url, '_blank', 'noopener'));
        const markBtn = $('#markDoneBtn', foot);
        markBtn.addEventListener('click', () => {
          markBtn.disabled = true;
          callServer('markDriveItemComplete', lib ? lib.teamKey : '', d.id).then(() => {
            const s = $('#markState', body); if (s) s.textContent = '✓ برای شما به‌عنوان تکمیل‌شده ثبت شد.';
            state.bootstrap = null;
            toast('پیشرفت شما ثبت شد');
            if (lib && lib._reload) lib._reload();
          }).catch(err => { markBtn.disabled = false; toast(err.message, 'error'); });
        });
        const quizBtn = $('#itemQuizBtn', foot);
        if (quizBtn) quizBtn.addEventListener('click', () => { closeModal(); startQuizByRef(d.quiz, d, lib); });
      }
    });
  }

  /* شروع آزمون از روی آیتم کتابخانه */
  function startQuizByRef(quizId, d, lib) {
    if (quizId) { startQuiz(quizId, { contextLabel: d.name, onDone: lib && lib._reload }); return; }
    toast('آزمون این آیتم پیدا نشد.', 'error');
  }

  /* ════════════════════════════════════════
     کتابخانه (نمای مستقل)
     ════════════════════════════════════════ */
  VIEWS.library = async () => {
    const b = state.bootstrap || await callServer('getBootstrap');
    paintChromeIfNeeded(b);
    if (!(state.teams || []).length) { $('#view').innerHTML = emptyHTML('🏢', 'تیمی در دسترس نیست', 'برای حساب شما تیمی تعریف نشده است.'); return; }
    const q = state.params.q || '';
    $('#view').innerHTML = '<div class="section-head"><h3>کتابخانه محتوای آموزشی</h3><small>دریافت مستقیم از Google Drive — صفحه‌ای و بدون بارگذاری کل فایل‌ها</small></div><div id="libraryRoot"></div>';
    const lib = renderLibraryBrowser($('#libraryRoot'), { teamKey: state.params.teamKey || state.teams[0].key });
    if (q) { const s = $('#libSearch'); if (s) { s.value = q; lib.search = q; lib._reload(); } }
  };

  /* ════════════════════════════════════════
     مسیر یادگیری
     ════════════════════════════════════════ */
  VIEWS.path = async (params) => {
    const pathId = params.pathId;
    const b = state.bootstrap || await callServer('getBootstrap');
    paintChromeIfNeeded(b);
    const resp = await callServer('getPath', pathId);
    const p = resp.path, items = resp.items || [];

    let html = '<section class="path-header">'
      + '<button class="icon-btn" id="backToTeams" aria-label="بازگشت">→</button>'
      + '<div class="path-header-main"><h2>' + esc(p.title) + '</h2><p>' + esc(p.description || '') + '</p>'
      + '<div class="pstep-meta" style="margin-top:8px;color:var(--muted);font-size:11px;display:flex;gap:12px"><span>تیم ' + esc(p.teamName) + '</span><span>' + fmtNum(p.total) + ' مرحله</span></div></div>'
      + '<div class="progress-big" style="min-width:190px"><div style="flex:1">' + progressHTML(p.percent) + '<div class="hint" style="margin-top:4px">' + fmtNum(p.done) + ' از ' + fmtNum(p.total) + ' مرحله تکمیل شده</div></div><span class="pb-num">' + fmtNum(p.percent) + '٪</span></div>'
      + '</section>';

    if (!items.length) {
      html += emptyHTML('📭', 'این مسیر هنوز محتوایی ندارد', 'مدیر محتوا هنوز آیتمی اضافه نکرده است.');
    } else {
      html += '<div class="path-steps">' + items.map((item, i) => {
        const done = item.status === 'completed';
        const locked = item.status === 'locked';
        const quizPending = item.status === 'quiz_pending';
        const idx = done ? '✓' : (locked ? '🔒' : fmtNum(item.order || i + 1));
        const typeLabel = item.itemType === 'video' ? 'ویدئو' : item.itemType === 'link' ? 'پیوند' : 'فایل Drive';
        let action = '';
        if (done) action = '<span class="tag tag-ok">تکمیل‌شده ✓</span>';
        else if (locked) action = '<span class="tag tag-muted">قفل</span>';
        else if (quizPending) action = '<button class="btn btn-soft btn-sm" data-view-item="' + esc(item.driveItemId || '') + '" data-item-id="' + esc(item.itemId) + '" data-item-title="' + esc(item.title) + '">مرور محتوا</button><button class="btn btn-primary btn-sm" data-quiz-id="' + esc(item.quizId) + '" data-item-title="' + esc(item.title) + '">شروع آزمون</button>';
        else action = '<button class="btn btn-navy btn-sm" data-view-item="' + esc(item.driveItemId || '') + '" data-item-id="' + esc(item.itemId) + '" data-item-title="' + esc(item.title) + '">مرور محتوا</button>';
        return '<div class="pstep ' + esc(item.status) + '">'
          + '<div class="pstep-index">' + idx + '</div>'
          + '<div class="pstep-body"><h4>' + esc(item.title) + '</h4>'
          + '<div class="pstep-meta"><span>' + typeLabel + '</span>'
          + (item.estimatedMin ? '<span>' + svgIcon(ICONS.clock, 'svg-inline') + ' حدود ' + fmtNum(item.estimatedMin) + ' دقیقه</span>' : '')
          + (item.required ? '<span class="tag tag-req">اجباری</span>' : '<span class="tag tag-opt">اختیاری</span>')
          + (item.quiz ? '<span class="tag tag-info">آزمون متصل</span>' : '')
          + (done && item.completedAt ? '<span>تکمیل: ' + fmtDate(item.completedAt) + '</span>' : '')
          + '</div></div>'
          + '<div class="pstep-actions">' + action + '</div>'
          + '</div>';
      }).join('') + '</div>';
    }

    $('#view').innerHTML = html;
    $('#backToTeams').addEventListener('click', () => go('teams'));
    $$('#view [data-quiz-id]').forEach(btn => btn.addEventListener('click', () => startQuiz(btn.getAttribute('data-quiz-id'), { contextLabel: btn.getAttribute('data-item-title'), onDone: () => go('path', params) })));
    $$('#view [data-view-item]').forEach(btn => btn.addEventListener('click', () => {
      openPathItemModal({ driveItemId: btn.getAttribute('data-view-item'), itemId: btn.getAttribute('data-item-id'), title: btn.getAttribute('data-item-title') }, params);
    }));
  };

  function openPathItemModal(item, params) {
    const driveUrl = item.driveItemId ? 'https://drive.google.com/open?id=' + item.driveItemId : '';
    const previewUrl = item.driveItemId ? 'https://drive.google.com/file/d/' + item.driveItemId + '/preview' : '';
    openModal({
      title: esc(item.title),
      size: 'lg',
      bodyHTML:
        (previewUrl && !isDemo()
          ? '<iframe src="' + esc(previewUrl) + '" title="پیش‌نمایش" style="width:100%;height:400px;border:1px solid var(--line);border-radius:12px;background:#fff" loading="lazy"></iframe>'
          : '<div class="empty" style="padding:30px"><span class="empty-ic">📄</span><h4>' + (isDemo() ? 'محتوای نمونه — پیش‌نمایش در نسخه واقعی از Drive نمایش داده می‌شود' : 'این محتوا پیش‌نمایش مستقیم ندارد') + '</h4></div>')
        + '<p class="hint" style="margin-top:10px">پس از مطالعه محتوا، دکمه «تکمیل و ثبت» را بزنید.</p>',
      footHTML:
        (driveUrl ? '<button class="btn btn-soft" id="openDrive2">↗ باز کردن در Drive</button>' : '')
        + '<button class="btn btn-primary" id="completeItemBtn">✓ تکمیل و ثبت</button>',
      onMount: (body, foot) => {
        const ob = $('#openDrive2', foot);
        if (ob) ob.addEventListener('click', () => window.open(driveUrl, '_blank', 'noopener'));
        $('#completeItemBtn', foot).addEventListener('click', () => {
          const btn = $('#completeItemBtn', foot);
          btn.disabled = true;
          callServer('markItemComplete', item.itemId).then(() => {
            closeModal();
            state.bootstrap = null;
            toast('این مرحله برای شما تکمیل شد ✓');
            go('path', params);
            loadNotifications(true).catch(() => {});
          }).catch(err => { btn.disabled = false; toast(err.message, 'error'); });
        });
      }
    });
  }

  /* ════════════════════════════════════════
     کارنامه (تریبتی)
     ════════════════════════════════════════ */
  VIEWS.transcript = async () => {
    const b = state.bootstrap || await callServer('getBootstrap');
    paintChromeIfNeeded(b);
    const resp = await callServer('getMyTranscript');
    const s = resp.summary || {};
    const attempts = resp.attempts || [];

    let html = '<div class="stats">'
      + statCard('accent', '▣', 'کل تلاش‌ها', fmtNum(s.totalAttempts), 'در همه آزمون‌ها')
      + statCard('ok', '✓', 'آزمون‌های گذرانده', fmtNum(s.passedQuizzes) + ' <small style="font-size:12px;color:var(--muted)">/ ' + fmtNum(s.uniqueQuizzes) + '</small>', 'از آزمون‌های منحصربه‌فرد')
      + statCard('gold', '★', 'میانگین نمره', fmtNum(s.avgScore) + '٪', 'در همه تلاش‌ها')
      + statCard('warn', '✎', 'در انتظار بازبینی', fmtNum(attempts.filter(a => a.status === 'pending_review').length), 'سوالات تشریحی توسط منتور بررسی می‌شود')
      + '</div>';

    html += '<div class="panel"><div class="section-head" style="margin:0 0 12px"><h3>تاریخچه آزمون‌ها</h3><small>' + fmtNum(attempts.length) + ' تلاش ثبت‌شده</small></div>';
    if (!attempts.length) {
      html += emptyHTML('📝', 'هنوز در آزمونی شرکت نکرده‌اید', 'آزمون‌ها از داخل مسیر یادگیری یا کتابخانه در دسترس‌اند.');
    } else {
      html += '<div class="table-wrap"><table class="data"><thead><tr><th>آزمون</th><th>تاریخ</th><th>نمره</th><th>وضعیت</th><th>نتیجه</th><th>بازخورد</th></tr></thead><tbody>'
        + attempts.map(a => {
          const st = a.status === 'pending_review' ? '<span class="tag tag-warn" style="background:var(--warn-soft);color:var(--warn)">در انتظار بازبینی</span>' : a.status === 'reviewed' ? '<span class="tag tag-info">بازبینی‌شده</span>' : '<span class="tag tag-muted">خودکار</span>';
          const res = a.passed ? '<span class="tag tag-ok">قبول</span>' : '<span class="tag tag-danger">رد</span>';
          return '<tr><td>' + esc(a.quizTitle) + '</td><td>' + fmtDateTime(a.timestamp) + '</td><td><strong>' + fmtNum(a.score) + '٪</strong></td><td>' + st + '</td><td>' + res + '</td><td class="hint">' + esc(a.feedback || '—') + '</td></tr>';
        }).join('')
        + '</tbody></table></div>';
    }
    html += '</div>';
    $('#view').innerHTML = html;
  };

  /* ════════════════════════════════════════
     موتور آزمون (سمت کاربر)
     ════════════════════════════════════════ */
  function startQuiz(quizId, opts) {
    opts = opts || {};
    openModal({ title: 'در حال آماده‌سازی آزمون…', size: 'lg', bodyHTML: loadingHTML('دریافت اطلاعات آزمون…') });
    callServer('getQuizForAttempt', quizId).then(resp => {
      state.quiz = {
        quizId: quizId, contextLabel: opts.contextLabel || '', onDone: opts.onDone || null,
        meta: resp.quiz, questions: resp.questions || [], answers: {}, current: 0,
        attemptToken: resp.attemptToken || '', startedAt: Date.now(), remaining: (resp.quiz.timeLimitMin || 0) * 60
      };
      renderQuizStart();
    }).catch(err => {
      openModal({ title: 'آزمون', size: 'lg', bodyHTML: errorHTML(err.message), footHTML: '<button class="btn btn-soft" data-close>بستن</button>' });
    });
  }

  function renderQuizStart() {
    const s = state.quiz, q = s.meta;
    const attemptsLeft = q.maxAttempts ? (q.maxAttempts - q.attemptsUsed) : Infinity;
    openModal({
      title: 'شروع آزمون',
      size: 'lg',
      bodyHTML:
        '<div class="quiz-start"><div class="qs-icon">✎</div>'
        + '<h3 style="margin:0 0 6px">' + esc(q.title) + '</h3>'
        + (q.description ? '<p class="hint" style="max-width:440px;margin:0 auto">' + esc(q.description) + '</p>' : '')
        + '<div class="quiz-meta"><span>' + fmtNum(s.questions.length) + ' سؤال</span><span>' + fmtNum(q.totalPoints) + ' نمره</span><span>حدنصاب قبولی: ' + fmtNum(q.passScore) + '٪</span>'
        + (q.timeLimitMin ? '<span>زمان: ' + fmtNum(q.timeLimitMin) + ' دقیقه</span>' : '<span>بدون محدودیت زمانی</span>')
        + (q.maxAttempts ? '<span>تلاش باقی‌مانده: ' + fmtNum(attemptsLeft) + ' از ' + fmtNum(q.maxAttempts) + '</span>' : '<span>تلاش نامحدود</span>')
        + '</div>'
        + '<p class="hint">زمان آزمون از لحظه دریافت این صفحه محاسبه می‌شود. امکان بازگشت به سؤالات قبلی وجود دارد.</p>'
        + '</div>',
      footHTML: '<button class="btn btn-soft" data-close>انصراف</button><button class="btn btn-primary" id="beginQuizBtn">شروع آزمون ✎</button>',
      onMount: (body, foot) => $('#beginQuizBtn', foot).addEventListener('click', beginQuiz)
    });
  }

  function beginQuiz() {
    const s = state.quiz;
    s.answers = {};
    s.current = 0;
    if (s.meta.timeLimitMin) {
      s.remaining = Math.max(0, Math.ceil(s.meta.timeLimitMin * 60 - (Date.now() - s.startedAt) / 1000));
      if (!s.remaining) { autoSubmitQuiz(); return; }
      const t = setInterval(() => {
        s.remaining = Math.max(0, Math.ceil(s.meta.timeLimitMin * 60 - (Date.now() - s.startedAt) / 1000));
        const el = $('#quizTimer');
        if (el) {
          el.textContent = fmtClock(s.remaining);
          el.classList.toggle('danger', s.remaining <= 60);
        }
        if (s.remaining <= 0) { clearInterval(t); autoSubmitQuiz(); }
      }, 1000);
      state.timers.push(t);
    }
    renderRunner();
  }
  const fmtClock = sec => { sec = Math.max(0, sec | 0); const m = Math.floor(sec / 60), r = sec % 60; return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0'); };

  function optionObjs(q) {
    if (!q.options) return [];
    if (q.options.length && typeof q.options[0] === 'object') return q.options;
    return q.options.map((text, index) => ({ index, text }));
  }

  function renderRunner() {
    const s = state.quiz, i = s.current, q = s.questions[i];
    const answeredCount = s.questions.filter(x => isAnswered(x)).length;

    let html = '<div class="q-progress"><div class="q-progress-fill" style="width:' + Math.round(((i + 1) / s.questions.length) * 100) + '%"></div></div>'
      + '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">'
      + '<span class="hint">سؤال ' + fmtNum(i + 1) + ' از ' + fmtNum(s.questions.length) + ' — پاسخ‌داده‌شده: ' + fmtNum(answeredCount) + '</span>'
      + (s.meta.timeLimitMin ? '<span class="quiz-timer" id="quizTimer">' + fmtClock(s.remaining) + '</span>' : '<span class="hint">بدون محدودیت زمانی</span>')
      + '</div>'
      + '<div class="question-block"><div class="q-head"><span>' + fmtNum(i + 1) + '. ' + esc(q.text) + '</span><span class="q-points">' + fmtNum(q.points) + ' نمره' + (q.type === 'essay' ? ' • تشریحی' : '') + '</span></div>'
      + renderAnswerInput(q)
      + '</div>'
      + '<div class="q-palette">' + s.questions.map((x, j) => '<button class="q-dot' + (j === i ? ' current' : '') + (isAnswered(x) ? ' answered' : '') + '" data-goto="' + j + '">' + fmtNum(j + 1) + '</button>').join('') + '</div>';

    openModal({
      title: esc(s.meta.title),
      size: 'lg',
      bodyHTML: html,
      footHTML: '<button class="btn btn-soft" id="prevQBtn" ' + (i === 0 ? 'disabled' : '') + '>→ قبلی</button>'
        + (i < s.questions.length - 1
            ? '<button class="btn btn-navy" id="nextQBtn">بعدی ←</button>'
            : '<button class="btn btn-primary" id="submitQuizBtn">ثبت و ارسال آزمون ✓</button>'),
      onMount: (body, foot) => {
        bindAnswerInputs(body, q);
        $$('[data-goto]', body).forEach(b => b.addEventListener('click', () => { persistCurrentQuestion(body); s.current = parseInt(b.getAttribute('data-goto'), 10); renderRunner(); }));
        const prev = $('#prevQBtn', foot); if (prev) prev.addEventListener('click', () => { persistCurrentQuestion(body); s.current--; renderRunner(); });
        const next = $('#nextQBtn', foot); if (next) next.addEventListener('click', () => { persistCurrentQuestion(body); s.current++; renderRunner(); });
        const sub = $('#submitQuizBtn', foot); if (sub) sub.addEventListener('click', () => { persistCurrentQuestion(body); confirmSubmitQuiz(); });
      }
    });
  }

  function isAnswered(q) {
    const v = state.quiz.answers[q.questionId];
    if (q.type === 'multi') return Array.isArray(v) && v.length > 0;
    if (q.type === 'essay') return String(v || '').trim().length > 0;
    return v !== undefined && v !== null && v !== '';
  }

  function renderAnswerInput(q) {
    if (q.type === 'essay') {
      return '<textarea class="essay-box" id="essayInput" placeholder="پاسخ تشریحی خود را بنویسید…">' + esc(state.quiz.answers[q.questionId] || '') + '</textarea>'
        + '<p class="hint" style="margin-top:6px">پاسخ تشریحی توسط منتور/مدیر بازبینی و نمره‌دهی می‌شود.</p>';
    }
    const opts = optionObjs(q);
    const multi = q.type === 'multi';
    const inputType = multi ? 'checkbox' : 'radio';
    const chosen = state.quiz.answers[q.questionId];
    return opts.map(o => {
      const checked = multi ? (Array.isArray(chosen) && chosen.indexOf(o.index) !== -1) : chosen !== undefined && chosen !== null && Number(chosen) === o.index;
      return '<label class="option' + (checked ? ' selected' : '') + '"><input type="' + inputType + '" name="ans" value="' + o.index + '"' + (checked ? ' checked' : '') + '>' + esc(o.text) + '</label>';
    }).join('') + (multi ? '<p class="hint">می‌توانید چند گزینه را انتخاب کنید.</p>' : '');
  }

  function bindAnswerInputs(body, q) {
    if (q.type === 'essay') { $('#essayInput', body).addEventListener('input', e => { state.quiz.answers[q.questionId] = e.target.value; }); return; }
    $$('input[name="ans"]', body).forEach(input => {
      input.addEventListener('change', () => {
        if (q.type === 'multi') {
          const vals = $$('input[name="ans"]:checked', body).map(x => Number(x.value));
          state.quiz.answers[q.questionId] = vals;
        } else {
          state.quiz.answers[q.questionId] = Number(input.value);
        }
        $$('.option', body).forEach(l => l.classList.toggle('selected', l.querySelector('input').checked));
      });
    });
  }

  function persistCurrentQuestion(body) {
    const q = state.quiz.questions[state.quiz.current];
    if (q.type === 'essay') {
      const t = $('#essayInput', body);
      if (t) state.quiz.answers[q.questionId] = t.value;
    }
  }

  function confirmSubmitQuiz() {
    const s = state.quiz;
    const unanswered = s.questions.filter(q => !isAnswered(q)).length;
    openModal({
      title: 'ثبت و ارسال آزمون', size: 'lg',
      bodyHTML: unanswered ? '<strong>' + fmtNum(unanswered) + ' سؤال بی‌پاسخ مانده است.</strong><p>آزمون با پاسخ‌های فعلی ثبت می‌شود.</p>' : '<p>پس از ارسال، پاسخ‌ها قابل تغییر نیستند.</p>',
      footHTML: '<button class="btn btn-soft" id="returnQuiz">بازگشت به آزمون</button><button class="btn btn-primary" id="sendQuiz">ارسال آزمون</button>',
      onMount: (body, foot) => {
        $('#returnQuiz', foot).addEventListener('click', renderRunner);
        $('#sendQuiz', foot).addEventListener('click', () => { clearTimers(); submitQuizNow(); });
      }
    });
  }

  function autoSubmitQuiz() {
    const body = $('#modalBody');
    const q = state.quiz.questions[state.quiz.current];
    if (q) persistCurrentQuestion(body || document);
    submitQuizNow();
  }

  function submitQuizNow() {
    const s = state.quiz;
    if (!s) return;
    const answers = s.questions.map(q => {
      const v = s.answers[q.questionId];
      return { questionId: q.questionId, value: v === undefined ? (q.type === 'multi' ? [] : q.type === 'essay' ? '' : -1) : v };
    });
    const timeSpent = Math.round((Date.now() - s.startedAt) / 1000);
    openModal({ title: 'در حال ثبت و نمره‌دهی…', size: 'lg', bodyHTML: loadingHTML('ارسال پاسخ‌ها به سرور…') });
    callServer('submitQuiz', s.quizId, answers, timeSpent, s.attemptToken).then(resp => {
      clearTimers();
      renderQuizResult(resp);
    }).catch(err => {
      openModal({ title: 'خطا در ثبت آزمون', size: 'lg', bodyHTML: errorHTML(err.message), footHTML: '<button class="btn btn-soft" data-close>بستن</button>' });
    });
  }

  function renderQuizResult(r) {
    const s = state.quiz;
    const pass = r.passed;
    const pending = r.status === 'pending_review';
    const ring = scoreRing(r.score, pass ? 'var(--ok)' : pending ? 'var(--warn)' : 'var(--danger)');
    let html = '<div class="result">' + ring
      + '<h3>' + (pending ? 'پاسخ‌ها ثبت شد' : pass ? 'آفرین! قبول شدید 🎉' : 'این بار حدنصاب کسب نشد') + '</h3>'
      + '<p>' + (pending ? 'سؤالات تشریحی شما در انتظار بازبینی منتور/مدیر است.' : 'نمره شما: <strong>' + fmtNum(r.score) + '٪</strong> — حدنصاب: ' + fmtNum(r.passScore) + '٪') + '</p>'
      + '<div class="quiz-meta"><span>پاسخ صحیح: ' + fmtNum(r.correctCount) + '</span><span>پاسخ غلط: ' + fmtNum(r.wrongCount) + '</span>' + (pending ? '<span>در انتظار بازبینی: ' + fmtNum(r.pendingCount) + '</span>' : '') + '<span>تلاش: ' + fmtNum(r.attemptsUsed) + (r.maxAttempts ? ' از ' + fmtNum(r.maxAttempts) : '') + '</span></div>';
    if (r.review) {
      html += '<div style="text-align:right;margin-top:14px"><h4 style="font-size:13px;margin:0 0 6px">مرور پاسخ‌ها</h4>'
        + r.review.map(rv => {
          const q = s.questions.find(x => x.questionId === rv.questionId) || {};
          const cls = rv.isCorrect === null ? 'pending' : rv.isCorrect ? 'right' : 'wrong';
          const icon = rv.isCorrect === null ? '⏳' : rv.isCorrect ? '✓' : '✗';
          const options = optionObjs(q);
          const labels = ids => (Array.isArray(ids) ? ids : [ids]).map(id => { const o = options.find(x => Number(x.index) === Number(id)); return o ? o.text : ''; }).filter(Boolean).join('، ') || '—';
          const answerDetail = rv.isCorrect === null ? '' : '<div class="hint">پاسخ شما: ' + esc(labels(rv.given)) + ' • پاسخ صحیح: ' + esc(labels(rv.correct)) + '</div>';
          return '<div class="review-item ' + cls + '"><strong>' + icon + ' ' + esc(q.text || rv.questionId) + '</strong><div class="hint" style="margin-top:4px">' + (rv.isCorrect === null ? 'نیازمند بازبینی — ' + fmtNum(rv.points) + ' نمره' : (rv.isCorrect ? 'درست' : 'نادرست') + ' — امتیاز: ' + fmtNum(rv.awarded) + ' از ' + fmtNum(rv.points)) + '</div>' + answerDetail + (rv.explanation ? '<div class="hint">توضیح: ' + esc(rv.explanation) + '</div>' : '') + (rv.sourceLocation ? '<div class="hint">مستند: ' + esc(rv.sourceLocation) + '</div>' : '') + '</div>';
        }).join('')
        + '</div>';
    } else if (!pending) {
      html += '<p class="hint" style="margin-top:10px">نمایش پاسخ‌های صحیح بر اساس تنظیمات این آزمون غیرفعال است.</p>';
    }
    html += '</div>';
    const attemptsLeft = s.meta.maxAttempts ? s.meta.maxAttempts - r.attemptsUsed : Infinity;
    const foot = (!pass && !pending && attemptsLeft > 0 ? '<button class="btn btn-navy" id="retryQuizBtn">تلاش مجدد' + (Number.isFinite(attemptsLeft) ? ' (' + fmtNum(attemptsLeft) + ' تلاش باقی‌مانده)' : '') + '</button>' : '')
      + '<button class="btn btn-primary" id="finishQuizBtn">بستن</button>';
    openModal({
      title: 'نتیجه آزمون', size: 'lg', bodyHTML: html, footHTML: foot,
      onMount: (body, footEl) => {
        $('#finishQuizBtn', footEl).addEventListener('click', () => { closeModal(); const cb = s.onDone; if (cb) { try { cb(); } catch (e) {} } refreshBadges(); });
        const retry = $('#retryQuizBtn', footEl);
        if (retry) retry.addEventListener('click', () => startQuiz(s.quizId, { contextLabel: s.contextLabel, onDone: s.onDone }));
      }
    });
  }

  function scoreRing(percent, color) {
    const p = Math.max(0, Math.min(100, Number(percent) || 0));
    const r = 52, c = 2 * Math.PI * r, off = c * (1 - p / 100);
    return '<svg class="score-ring" width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="نمره ' + p + ' درصد">'
      + '<circle cx="65" cy="65" r="' + r + '" stroke="var(--panel-3)" stroke-width="12" fill="none"/>'
      + '<circle cx="65" cy="65" r="' + r + '" stroke="' + color + '" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset 1s ease"/>'
      + '<text x="65" y="61" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text)">' + p + '٪</text>'
      + '<text x="65" y="82" text-anchor="middle" font-size="10" fill="var(--muted)">نمره شما</text></svg>';
  }

  function refreshBadges() {
    state.bootstrap = null;
    loadNotifications(true).catch(() => {});
    // به‌روزرسانی نرم آمار داشبورد بدون رفرش کامل صفحه
    if (state.view === 'dashboard') go('dashboard');
  }

  /* ════════════════════════════════════════
     پنل مدیریت (پیاده‌سازی در Admin.html)
     ════════════════════════════════════════ */
  VIEWS.admin = async () => {
    const b = state.bootstrap || await callServer('getBootstrap');
    paintChromeIfNeeded(b);
    if (state.user.role !== 'admin') { $('#view').innerHTML = errorHTML('شما مجوز دسترسی به پنل مدیریت را ندارید.'); return; }
    if (window.Admin && window.Admin.render) return window.Admin.render($('#view'), window.__app);
    $('#view').innerHTML = errorHTML('ماژول مدیریت بارگذاری نشد.');
  };

  /* ───────── اعلانات (مدال زنگوله) ───────── */
  let notificationPoll = null;
  function loadNotifications(showPopup) {
    return callServer('listNotifications').then(resp => {
      const items = resp.notifications || [];
      const badge = $('#bellBadge');
      badge.hidden = !resp.unread; badge.textContent = fmtNum(resp.unread);
      const first = items.find(n => !n.read);
      if (showPopup && first && !overlay().classList.contains('open')) showNotification(first);
      return items;
    });
  }
  function showNotification(n) {
    openModal({ title: esc(n.title), bodyHTML: '<p style="white-space:pre-wrap">'+esc(n.body)+'</p><p class="hint">'+fmtDateTime(n.createdAt)+'</p>',
      footHTML: '<button class="btn btn-soft" data-close>بعداً</button><button class="btn btn-primary" id="noticeRead">خواندم</button>',
      onMount: (body, foot) => $('#noticeRead', foot).addEventListener('click', () => {
        const btn = $('#noticeRead', foot); btn.disabled = true;
        callServer('markNotificationRead', n.id).then(() => { closeModal(); return loadNotifications(true); }).catch(err => { btn.disabled = false; toast(err.message, 'error'); });
      }) });
  }
  function openAnnouncementsModal() {
    openModal({ title: 'اطلاعیه‌ها', bodyHTML: loadingHTML('در حال دریافت اطلاعیه‌ها…') });
    loadNotifications(false).then(items => {
      $('#modalBody').innerHTML = items.length
        ? '<div style="display:grid;gap:10px">' + items.map((n,i) => '<div class="ann-item"><div class="ann-ic">🔔</div><div style="min-width:0;flex:1"><h5>'+esc(n.title)+(n.read?'':' • جدید')+'</h5><p>'+esc(n.body)+'</p><time>'+fmtDateTime(n.createdAt)+'</time></div><button class="btn btn-soft btn-sm" data-notice="'+i+'">مشاهده</button></div>').join('') + '</div>'
        : emptyHTML('🔔', 'اطلاعیه‌ای وجود ندارد', 'اطلاعیه‌های شما اینجا نمایش داده می‌شود.');
      $$('[data-notice]', $('#modalBody')).forEach(btn => btn.addEventListener('click', () => showNotification(items[Number(btn.dataset.notice)])));
    }).catch(err => { $('#modalBody').innerHTML = errorHTML(err.message); });
  }

  /* ───────── تم روشن/تاریک ───────── */
  function applyTheme(theme) {
    state.theme = theme;
    document.body.setAttribute('data-theme', theme);
    const dark = theme === 'dark';
    $('#themeIcon').textContent = dark ? '☀' : '☾';
    $('#themeLabel').textContent = dark ? 'تغییر به حالت روشن' : 'تغییر به حالت تاریک';
    try { localStorage.setItem('bba-theme', theme); } catch (e) {}
  }
  function toggleTheme() { applyTheme(state.theme === 'dark' ? 'light' : 'dark'); }

  /* ───────── راه‌اندازی ───────── */
  function bindChrome() {
    $('#menuBtn').addEventListener('click', openSidebar);
    $('#scrim').addEventListener('click', closeSidebar);
    $('#modalClose').addEventListener('click', closeModal);
    overlay().addEventListener('click', e => { if (e.target === overlay()) closeModal(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(tag)) { e.preventDefault(); $('#globalSearch').focus(); }
    });
    document.addEventListener('click', e => { const c = e.target.closest('[data-close]'); if (c) closeModal(); });
    $('#globalSearch').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); const q = e.target.value.trim(); go('library', q ? { q: q } : {}); }
    });
    $('#bellBtn').addEventListener('click', openAnnouncementsModal);
    $('#themeToggle').addEventListener('click', toggleTheme);
    $('#sideUser').addEventListener('click', () => go('transcript'));
    $('#sideUser').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go('transcript'); } });


  }

  function storeSession(token) {
    state.sessionToken = token;
    try { if (token) sessionStorage.setItem('bba-session', token); else sessionStorage.removeItem('bba-session'); } catch (_) {}
  }
  function showLogin(message) {
    storeSession(''); pendingReads.clear(); state.bootstrap = null; state.user = null; state.teams = [];
    closeModal(); closeSidebar();
    $('#appRoot').hidden = true; $('#loginScreen').hidden = false;
    $('#loginPassword').value = '';
    const e = $('#loginError'); e.hidden = !message; e.textContent = message || '';
    $('#loginUsername').focus();
  }
  function loginRequest(username, password) {
    if (isDemo()) return Promise.reject(new Error('اتصال به سرور Apps Script برقرار نیست. وب‌اپ منتشرشده را باز کنید.'));
    return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(new Error(e.message || String(e)))).login(username, password));
  }
  async function enterApplication() {
    const b = await callServer('getBootstrap');
    state.bootstrap = b; state.teams = b.teams || []; state.pageSize = b.pageSize || 12;
    await paintChrome(b);
    $('#loginScreen').hidden = true; $('#appRoot').hidden = false;
    go('dashboard');
    loadNotifications(true).catch(err => toast(err.message, 'error'));
    if (!notificationPoll) notificationPoll = setInterval(() => { if (state.sessionToken) { loadNotifications(true).catch(() => {}); callServer('presencePing').catch(() => {}); } }, 60000);
  }
  async function boot() {
    let saved = null;
    try { saved = localStorage.getItem('bba-theme'); } catch (e) {}
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));
    if (typeof BRAND !== 'undefined') {
      $('#brandMark').innerHTML = '<img src="' + BRAND.mark + '" alt="لوگوی بیمه‌بازار">';
      $('#loginBrand').innerHTML = '<img src="' + BRAND.mark + '" alt="بیمه‌بازار">';
      let link = document.querySelector('link[rel="icon"]');
      if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
      link.type = 'image/png'; link.href = BRAND.favicon;
    }
    bindChrome();
    $('#loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = $('#loginButton'), error = $('#loginError');
      btn.disabled = true; btn.textContent = 'در حال ورود و دریافت اطلاعات…'; error.hidden = true;
      try {
        const r = await loginRequest($('#loginUsername').value.trim(), $('#loginPassword').value);
        $('#loginPassword').value = ''; storeSession(r.token);
        await enterApplication();
      } catch (err) { showLogin(err.message); }
      finally { btn.disabled = false; btn.textContent = 'ورود'; }
    });
    $('#logoutBtn').addEventListener('click', () => {
      const token = state.sessionToken;
      if (token && !isDemo()) google.script.run.withSuccessHandler(() => {}).withFailureHandler(() => {}).logout(token);
      clearTimers(); closeSidebar(); showLogin('از حساب خارج شدید.');
    });
    let token = ''; try { token = sessionStorage.getItem('bba-session') || ''; } catch (_) {}
    if (token) { storeSession(token); try { await enterApplication(); return; } catch (e) { showLogin('نشست قبلی معتبر نیست. دوباره وارد شوید.'); return; } }
    showLogin();
  }

  // رابط عمومی برای Admin.html و رویدادهای درون‌خطی
  window.__app = {
    state, callServer, go, VIEWS,
    openModal, closeModal, confirmModal, toast,
    esc, fmtDate, fmtDateTime, fmtNum,
    progressHTML, loadingHTML, errorHTML, emptyHTML, statCard,
    isDemo, refreshBadges, startQuiz, renderLibraryBrowser
  };
  window.App = { go: function () { return go.apply(null, arguments); } };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return { go: go };
})();
</script>

</body>
</html>
